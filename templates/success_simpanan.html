<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Berhasil - Koperasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container mt-5 text-center">
    <div class="alert alert-success">
      <i class="bi bi-check-circle-fill fs-1 text-success mb-3 d-block"></i>
      <h2>{{ .message }}</h2>
      <p>Menunggu konfirmasi bendahara...</p>
      <a href="{{ .redirect }}" class="btn btn-primary btn-lg">
        <i class="bi bi-arrow-right"></i> Lihat Riwayat
      </a>
      <script>
        setTimeout(() => location.href = '{{ .redirect }}', 3000);
      </script>
    </div>
  </div>
</body>
</html>
