<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
    <title>KOPMA</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
      <link href="/static/css/bendahara_navbar.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
      <!-- <link rel="stylesheet" href="/static/css/bendahara_navbar.css">
    <link href="/static/css/bendahara_edit_bunga.css" rel="stylesheet"> -->
    
</head>
<body>
    {{ template "bendahara_navbar.html" . }}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br>
            <h2 class="mb-4">Edit Bunga</h2>

            <!-- Form Edit Bunga -->
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <i class="fa-solid fa-edit"></i> Pengaturan Bunga
                </div>
                <div class="card-body">
                    {{ if .Error }}
                    <div class="alert alert-danger" role="alert">
                        {{ .Error }}
                    </div>
                    {{ end }}
                    <form method="POST" action="/bendahara/edit-bunga">
                        <div class="mb-3">
                            <label for="bunga" class="form-label">Nilai Bunga (%)</label>
                            <input type="number" step="0.01" min="0" max="100" id="bunga" name="bunga" class="form-control"
                                value="{{ .CurrentBunga }}" required />
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i> Simpan
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bendahara_navbar.js"></script>
</body>
</html>
