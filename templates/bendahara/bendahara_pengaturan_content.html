{{define "content"}}
<link rel="stylesheet" href="/static/css/bendahara_pengaturan.css">

<!-- <div class="top-header">
    <h4 class="mb-1">Pengaturan Akun</h4>
    <small class="text-muted">Kelola informasi akun dan keamanan</small>
</div> -->
<br><br><br>
<div class="row">
    <div class="col-md-8">

        <!-- Form Ganti Password -->
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <i class="fa-solid fa-key"></i> Ganti Password
            </div>
            <div class="card-body">
                <form id="passwordForm" action="/bendahara/update-profile" method="POST">
                    <div class="mb-3">
                        <label for="editUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="editUsername" name="username" value="{{.Bendahara.Username}}" autocomplete="username" required>
                        <!-- <div class="form-text">Username harus unik dan tidak boleh kosong.</div> -->
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Password Baru</label>
                        <input type="password" class="form-control" id="newPassword" name="password" autocomplete="new-password">
                        <small class="text-muted">Kosongkan jika tidak ingin mengubah password</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Konfirmasi Password Baru</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" autocomplete="new-password">
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-warning" id="btnSimpanPerubahan">
                            <i class="fa-solid fa-key"></i> Simpan Perubahan
                        </button>
                        <div id="formAlert" class="mt-3"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <!-- Info Akun -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white">
                <i class="fa-solid fa-info-circle"></i> Info Akun
            </div>
            <div class="card-body">
                <div class="text-center mb-3">
                    <img src="{{if .LogoPath}}{{.LogoPath}}{{else}}/static/images/placeholder.png{{end}}" alt="Logo Koperasi" class="rounded-circle" width="80" height="80">
                    <h6 class="mt-2">{{.Bendahara.NamaPengelola}}</h6>
                    <small class="text-muted">{{.Bendahara.JabatanKoperasi}}</small>
                </div>
                <hr>
                <div class="small">
                    <p><strong>Username:</strong> <span id="info-username">{{.Bendahara.Username}}</span></p>
                    <p><strong>Password:</strong> 
                        <span id="password-text" data-password="{{.Bendahara.PlainPassword}}">********</span>
                        <button type="button" id="togglePassword" class="btn btn-sm btn-outline-secondary ms-2" style="padding:2px 8px; font-size:0.85em;">
                            <i class="fa fa-eye"></i>
                        </button>
                        <span id="password-fallback" data-fallback="{{.Bendahara.Password}}" style="display:none;"></span>
                    </p>
                    <p><strong>Level:</strong> {{.Bendahara.Level}}</p>
                    <p><strong>Status:</strong> <span class="badge bg-success">{{.Bendahara.Status}}</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/bendahara_pengaturan_content.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // AJAX submit untuk form update profile bendahara
    var passwordForm = document.getElementById('passwordForm');
    var formAlert = document.getElementById('formAlert');
    if (passwordForm) {
        passwordForm.addEventListener('submit', function(e) {
            e.preventDefault();
            formAlert.innerHTML = '';
            var password = passwordForm.querySelector('[name="password"]').value.trim();
            var confirmPassword = passwordForm.querySelector('[name="confirm_password"]').value.trim();
            if (password !== '' && confirmPassword === '') {
                formAlert.innerHTML = '<div class="alert alert-danger">Konfirmasi Password Baru wajib diisi jika ingin mengubah password.</div>';
                return;
            }
            var formData = new FormData(passwordForm);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', passwordForm.action, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    try {
                        var res = JSON.parse(xhr.responseText);
                        if (xhr.status === 200 && res.message) {
                            formAlert.innerHTML = '<div class="alert alert-success">' + res.message + '</div>';
                            // Update username di Info Akun tanpa reload, gunakan data dari response jika ada
                            var infoUsername = document.getElementById('info-username');
                            if (infoUsername && res.username) {
                                infoUsername.textContent = res.username;
                            } else if (infoUsername) {
                                // fallback ke input value jika response tidak ada username
                                var newUsername = passwordForm.querySelector('[name="username"]').value;
                                infoUsername.textContent = newUsername;
                            }
                            passwordForm.reset();
                        } else if (res.error) {
                            formAlert.innerHTML = '<div class="alert alert-danger">' + res.error + '</div>';
                        } else {
                            formAlert.innerHTML = '<div class="alert alert-danger">Terjadi kesalahan.</div>';
                        }
                    } catch (err) {
                        formAlert.innerHTML = '<div class="alert alert-danger">Terjadi kesalahan.</div>';
                    }
                }
            };
            xhr.send(formData);
        });
    }
    var toggleBtn = document.getElementById('togglePassword');
    var pwText = document.getElementById('password-text');
    var pwFallback = document.getElementById('password-fallback');
    var shown = false;
    if (toggleBtn && pwText) {
        toggleBtn.addEventListener('click', function() {
            if (!shown) {
                var plain = pwText.getAttribute('data-password');
                if (plain && plain.trim() !== '') {
                    pwText.textContent = plain;
                } else if (pwFallback && pwFallback.getAttribute('data-fallback')) {
                    pwText.textContent = pwFallback.getAttribute('data-fallback');
                } else {
                    pwText.textContent = '(Password tidak tersedia)';
                }
                toggleBtn.innerHTML = '<i class="fa fa-eye-slash"></i>';
                shown = true;
            } else {
                pwText.textContent = '********';
                toggleBtn.innerHTML = '<i class="fa fa-eye"></i>';
                shown = false;
            }
        });
    }
});
</script>
{{end}}
