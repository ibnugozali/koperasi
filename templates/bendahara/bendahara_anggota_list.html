{{define "bendahara_anggota_list_content"}}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa-solid fa-users me-2"></i>Data Anggota</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Username</th>
                                    <th>Status</th>
                                    <th>Kode Anggota</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{range .Anggotas}}
                                <tr>
                                    <td>{{.IDAnggota}}</td>
                                    <td>{{.NamaAnggota}}</td>
                                    <td>{{.Username}}</td>
                                    <td>
                                        <span class="badge {{if eq .Status "aktif"}}bg-success{{else if eq .Status "pending"}}bg-warning{{else}}bg-secondary{{end}}">
                                            {{.Status}}
                                        </span>
                                    </td>
                                    <td>{{if .KodeAnggota}}{{.KodeAnggota}}{{else}}-{{end}}</td>
                                    <td>
                                        <a href="/bendahara/anggota/{{.IDAnggota}}" class="btn btn-sm btn-info">
                                            <i class="fa-solid fa-eye"></i> Lihat
                                        </a>
                                        <a href="/bendahara/anggota/edit/{{.IDAnggota}}" class="btn btn-sm btn-warning">
                                            <i class="fa-solid fa-edit"></i> Edit
                                        </a>
                                    </td>
                                </tr>
                                {{else}}
                                <tr>
                                    <td colspan="6" class="text-center">Tidak ada data anggota</td>
                                </tr>
                                {{end}}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
