{{define "bendahara_dashboard_content"}}
<div class="top-header">
    <h4 class="mb-1">Dashboard Bendahara</h4>
    <small class="text-muted">Ringkasan keuangan dan aktivitas koperasi</small>
</div>

<!-- Statistik -->
<div class="row g-4">
    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-primary"><i class="fa-solid fa-users"></i></div>
            <div class="stat-number text-primary">150</div>
            <div class="stat-label">Total Anggota</div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-success"><i class="fa-solid fa-wallet"></i></div>
            <div class="stat-number text-success">Rp 45.000.000</div>
            <div class="stat-label">Total Simpanan</div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-danger"><i class="fa-solid fa-money-bill-wave"></i></div>
            <div class="stat-number text-danger">Rp 120.000.000</div>
            <div class="stat-label">Total Pinjaman</div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-warning"><i class="fa-solid fa-chart-line"></i></div>
            <div class="stat-number text-warning">Rp 75.000.000</div>
            <div class="stat-label">Keuntungan Bulan Ini</div>
        </div>
    </div>
</div>

<!-- Aktivitas Terbaru - Grafik -->
<div class="mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <i class="fa-solid fa-chart-line"></i> Aktivitas Keuangan Bulanan
        </div>
        <div class="card-body">
            <canvas id="activityChart" width="400" height="200"></canvas>
        </div>
    </div>
</div>

<script>
    // Data untuk grafik aktivitas
    const ctx = document.getElementById('activityChart').getContext('2d');
    const activityChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
            datasets: [{
                label: 'Simpanan',
                data: [1200000, 1500000, 1800000, 2200000, 2500000, 2800000, 3000000, 3200000, 3500000, 3800000, 4000000, 4200000],
                borderColor: 'rgb(25, 135, 84)',
                backgroundColor: 'rgba(25, 135, 84, 0.1)',
                tension: 0.4,
                fill: true
            }, {
                label: 'Pinjaman',
                data: [5000000, 4500000, 6000000, 5500000, 7000000, 6500000, 8000000, 7500000, 9000000, 8500000, 10000000, 9500000],
                borderColor: 'rgb(220, 53, 69)',
                backgroundColor: 'rgba(220, 53, 69, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Aktivitas Simpanan dan Pinjaman Bulanan'
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value, index, values) {
                            return 'Rp ' + (value / 1000000).toFixed(0) + 'M';
                        }
                    }
                }
            }
        }
    });
</script>
{{end}}
