<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Bendahara - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/bendahara_navbar.css" rel="stylesheet">
     <link href="/static/css/admin_dashboard.css" rel="stylesheet">
 
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-content {
            margin-left: 280px;
            padding: 20px;
            transition: margin-left 0.3s ease;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }
        }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0 !important;
            padding: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #2d3748;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-danger {
            padding: 8px 20px;
            border-radius: 6px;
        }

        .btn-success {
            background: #48bb78;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
        }

        .item-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .item-card:hover {
            border-color: #667eea;
        }
    </style>
</head>
<body>

    {{template "bendahara_navbar.html" .}}
    
    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br><br>
            <div class="page-header">
                <h1><i class="fas fa-piggy-bank me-3"></i>Edit Halaman Simpanan</h1>
                <p>Kelola informasi jenis dan manfaat simpanan</p>
            </div>

            <form id="editForm" action="/bendahara/halaman/update/simpanan" method="POST">
                <input type="hidden" id="konten" name="konten">

                <!-- Judul -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-heading me-2"></i>Judul Halaman</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" class="form-control" id="judul" name="judul" value="{{ .Halaman.Judul }}" required>
                    </div>
                </div>

                <!-- Jenis Simpanan -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Jenis-Jenis Simpanan</h5>
                    </div>
                    <div class="card-body">
                        <div id="jenisSimpananContainer">
                            <!-- Jenis simpanan akan ditambahkan di sini -->
                        </div>
                        <button type="button" class="btn btn-success" onclick="tambahJenisSimpanan()">
                            <i class="fas fa-plus me-2"></i>Tambah Jenis Simpanan
                        </button>
                    </div>
                </div>

                <!-- Manfaat -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-check-circle me-2"></i>Manfaat Simpanan</h5>
                    </div>
                    <div class="card-body">
                        <div id="manfaatContainer">
                            <!-- Manfaat akan ditambahkan di sini -->
                        </div>
                        <button type="button" class="btn btn-success" onclick="tambahManfaat()">
                            <i class="fas fa-plus me-2"></i>Tambah Manfaat
                        </button>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="card">
                    <div class="card-body">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Simpan Perubahan
                        </button>
                        <a href="/bendahara/dashboard" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Kembali
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Data dari backend
        let kontenData = '{{ .Halaman.Konten }}';
        let kontenObj;
        try {
            kontenObj = JSON.parse(kontenData);
        } catch (e) {
            console.error('Error parsing JSON:', e);
            kontenObj = { jenis_simpanan: [], manfaat: [] };
        }

        // Load data jenis simpanan
        function loadJenisSimpanan() {
            const container = document.getElementById('jenisSimpananContainer');
            container.innerHTML = '';
            
            if (kontenObj.jenis_simpanan) {
                kontenObj.jenis_simpanan.forEach((item, index) => {
                    container.innerHTML += createJenisSimpananHTML(index, item.nama, item.deskripsi);
                });
            }
        }

        function createJenisSimpananHTML(index, nama = '', deskripsi = '') {
            return `
                <div class="item-card" id="jenis_${index}">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <label class="form-label">Nama Simpanan</label>
                            <input type="text" class="form-control jenis-nama" value="${nama}" placeholder="Contoh: Simpanan Pokok" name="jenis_nama[]">
                        </div>
                        <div class="col-md-7 mb-2">
                            <label class="form-label">Deskripsi</label>
                            <input type="text" class="form-control jenis-deskripsi" value="${deskripsi}" placeholder="Deskripsi singkat" name="jenis_deskripsi[]">
                        </div>
                        <div class="col-md-1 mb-2 d-flex align-items-end">
                            <button type="button" class="btn btn-danger" onclick="hapusJenisSimpanan(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function tambahJenisSimpanan() {
            const container = document.getElementById('jenisSimpananContainer');
            const index = document.querySelectorAll('.item-card').length;
            const div = document.createElement('div');
            div.innerHTML = createJenisSimpananHTML(index);
            container.appendChild(div.firstElementChild);
        }

        function hapusJenisSimpanan(index) {
            const element = document.getElementById(`jenis_${index}`);
            if (element) element.remove();
        }

        // Load data manfaat
        function loadManfaat() {
            const container = document.getElementById('manfaatContainer');
            container.innerHTML = '';
            
            if (kontenObj.manfaat) {
                kontenObj.manfaat.forEach((item, index) => {
                    container.innerHTML += createManfaatHTML(index, item);
                });
            }
        }

        function createManfaatHTML(index, text = '') {
            return `
                <div class="item-card" id="manfaat_${index}">
                    <div class="row">
                        <div class="col-md-11 mb-2">
                            <label class="form-label">Manfaat ${index + 1}</label>
                            <input type="text" class="form-control manfaat-text" value="${text}" placeholder="Tuliskan manfaat simpanan" name="manfaat_text[]">
                        </div>
                        <div class="col-md-1 mb-2 d-flex align-items-end">
                            <button type="button" class="btn btn-danger" onclick="hapusManfaat(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function tambahManfaat() {
            const container = document.getElementById('manfaatContainer');
            const index = document.querySelectorAll('#manfaatContainer .item-card').length;
            const div = document.createElement('div');
            div.innerHTML = createManfaatHTML(index);
            container.appendChild(div.firstElementChild);
        }

        function hapusManfaat(index) {
            const element = document.getElementById(`manfaat_${index}`);
            if (element) element.remove();
        }

        // Submit form
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Collect jenis simpanan
            const jenisSimpanan = [];
            document.querySelectorAll('#jenisSimpananContainer .item-card').forEach(item => {
                const nama = item.querySelector('.jenis-nama').value;
                const deskripsi = item.querySelector('.jenis-deskripsi').value;
                if (nama && deskripsi) {
                    jenisSimpanan.push({ nama, deskripsi });
                }
            });

            // Collect manfaat
            const manfaat = [];
            document.querySelectorAll('#manfaatContainer .manfaat-text').forEach(input => {
                if (input.value) {
                    manfaat.push(input.value);
                }
            });

            // Create JSON
            const konten = {
                judul: document.getElementById('judul').value,
                jenis_simpanan: jenisSimpanan,
                manfaat: manfaat
            };

            document.getElementById('konten').value = JSON.stringify(konten);
            this.submit();
        });

        // Initialize
        loadJenisSimpanan();
        loadManfaat();
    </script>
</body>
</html>
