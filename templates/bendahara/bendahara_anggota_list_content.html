<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Bendahara - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>

    {{ template "bendahara_navbar.html" . }}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br>
            <h2 class="mb-4">Dashboard Bendahara</h2>

            <!-- Statistik -->
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa-solid fa-users me-2"></i>Data Anggota</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nama</th>
                                    <th>Username</th>
                                    <th>Status</th>
                                    <th>Kode Anggota</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{range .Anggotas}}
                                <tr>
                                    <td>{{.IDAnggota}}</td>
                                    <td>{{.NamaAnggota}}</td>
                                    <td>{{.Username}}</td>
                                    <td>
                                        <span class="badge {{if eq .Status "aktif"}}bg-success{{else if eq .Status "pending"}}bg-warning{{else}}bg-secondary{{end}}">
                                            {{.Status}}
                                        </span>
                                    </td>
                                    <td>{{if .IDAnggota}}{{.IDAnggota}}{{else}}-{{end}}</td>
                                    <td>
                                        <a href="/bendahara/anggota/{{.IDAnggota}}" class="btn btn-sm btn-info">
                                            <i class="fa-solid fa-eye"></i> Lihat
                                        </a>
                                        <a href="/bendahara/anggota/edit/{{.IDAnggota}}" class="btn btn-sm btn-warning">
                                            <i class="fa-solid fa-edit"></i> Edit
                                        </a>
                                    </td>
                                </tr>
                                {{else}}
                                <tr>
                                    <td colspan="6" class="text-center">Tidak ada data anggota</td>
                                </tr>
                                {{end}}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
