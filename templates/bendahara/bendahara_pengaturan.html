{{define "bendahara_pengaturan_content"}}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0"><i class="fa-solid fa-gear me-2"></i>Pengaturan Profil</h5>
                </div>
                <div class="card-body">
                    {{if .Error}}
                    <div class="alert alert-danger">
                        <i class="fa-solid fa-exclamation-triangle me-2"></i>{{.Error}}
                    </div>
                    {{end}}
                    {{if .Bendahara}}
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="nama_pengelola" class="form-label">Nama Lengkap</label>
                                    <input type="text" class="form-control" id="nama_pengelola" value="{{.Bendahara.NamaPengelola}}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="jabatan_koperasi" class="form-label">Jabatan</label>
                                    <input type="text" class="form-control" id="jabatan_koperasi" value="{{.Bendahara.JabatanKoperasi}}" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="no_telepon" class="form-label">No. Telepon</label>
                                    <input type="text" class="form-control" id="no_telepon" value="{{.Bendahara.NoTelepon}}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" value="{{.Bendahara.Username}}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password Baru</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Kosongkan jika tidak ingin mengubah">
                                </div>
                                <div class="mb-3">
                                    <label for="confirm_password" class="form-label">Konfirmasi Password</label>
                                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Kosongkan jika tidak ingin mengubah">
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save me-2"></i>Simpan Perubahan
                        </button>
                    </form>
                    {{else}}
                    <div class="alert alert-warning">
                        <i class="fa-solid fa-exclamation-triangle me-2"></i>Data bendahara tidak ditemukan.
                    </div>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('profileForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch('/bendahara/update-profile', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            alert('Berhasil: ' + data.message);
            location.reload();
        } else if (data.error) {
            alert('Error: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat memperbarui profil');
    });
});
</script>
{{end}}
