<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
     <title>KOPMA</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_struktur.css" rel="stylesheet">
        <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">

         <br><br><br>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- STRUKTUR -->
                                <div class="mb-3">
                                    <label for="deskripsi_struktur" class="form-label">Deskripsi Singkat</label>
                                    <textarea class="form-control" id="deskripsi_struktur" name="deskripsi" rows="4">{{ .Konten.deskripsi }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="gambar_struktur" class="form-label">Gambar Struktur Organisasi</label>
                                    <input type="file" class="form-control file-upload" id="gambar_struktur" data-target="gambar_struktur">
                                    <div class="w-100 d-flex justify-content-center">
                                        <img id="preview_gambar_struktur" src="{{if .Konten.gambar_struktur}}{{ .Konten.gambar_struktur }}{{else}}/static/images/placeholder.png{{end}}" class="img-fluid img-thumbnail mt-2" style="max-width:350px;width:100%;height:auto;">
                                    </div>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                                    </button>
                                    <a href="/admin/halaman/edit/struktur" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Batal
                                    </a>
                                </div>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit_struktur.js"></script>
</body>
</html>
