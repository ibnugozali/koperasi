<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Halaman Statis - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
           
            <p class="text-muted">Kelola konten halaman <b>{{ .Halaman.Judul }}</b></p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm" action="/admin/halaman/update/{{ .Halaman.Slug }}" method="POST">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- SEJARAH -->
                                {{ if eq .Halaman.Slug "sejarah" }}
                                <div class="mb-3">
                                    <label for="teks" class="form-label">Teks Konten</label>
                                    <textarea class="form-control" id="teks" rows="8">{{ .Konten.teks }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Gambar Utama</label>
                                    <input type="file" class="form-control file-upload" data-target="gambar">
                                    <img id="preview_gambar" src="{{ .Konten.gambar }}" class="img-thumbnail mt-2" width="200">
                                </div>
                                {{ end }}

                                <!-- VISI MISI -->
                                {{ if eq .Halaman.Slug "visi-misi" }}
                                <div class="mb-3">
                                    <label for="visi" class="form-label">Visi</label>
                                    <textarea class="form-control" id="visi" rows="5">{{ .Konten.visi }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="misi" class="form-label">Misi</label>
                                    <textarea class="form-control" id="misi" rows="5">{{ .Konten.misi }}</textarea>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Gambar Visi</label>
                                        <input type="file" class="form-control file-upload" data-target="gambar1">
                                        <img id="preview_gambar1" src="{{ .Konten.gambar1 }}" class="img-thumbnail mt-2" width="200">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Gambar Misi</label>
                                        <input type="file" class="form-control file-upload" data-target="gambar2">
                                        <img id="preview_gambar2" src="{{ .Konten.gambar2 }}" class="img-thumbnail mt-2" width="200">
                                    </div>
                                </div>
                                {{ end }}

                                <!-- STRUKTUR -->
                                {{ if eq .Halaman.Slug "struktur" }}
                                <div class="mb-3">
                                    <label for="deskripsi" class="form-label">Deskripsi Singkat</label>
                                    <textarea class="form-control" id="deskripsi" rows="4">{{ .Konten.deskripsi }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Gambar Struktur Organisasi</label>
                                    <input type="file" class="form-control file-upload" data-target="gambar_struktur">
                                    <img id="preview_gambar_struktur" src="{{ .Konten.gambar_struktur }}" class="img-fluid img-thumbnail mt-2" width="300">
                                </div>
                                {{ end }}

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Perubahan</button>
                                    <a href="/admin/halaman" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i> Batal</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit.js"></script>
</body>
</html>
