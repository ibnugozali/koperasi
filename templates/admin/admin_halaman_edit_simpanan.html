<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Halaman Simpanan - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_simpanan.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">

            <p class="text-muted">Kelola konten halaman <b>{{ .Halaman.Judul }}</b></p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- SIMPANAN -->
                                <div id="simpanan-container">
                                    <h5 class="mb-3">Jenis Simpanan</h5>
                                    {{ if .Konten.jenis_simpanan }}
                                        {{ range $index, $item := .Konten.jenis_simpanan }}
                                        <div class="simpanan-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="simpanan_title_{{ $index }}" class="form-label">Nama Jenis Simpanan</label>
                                                    <input type="text" class="form-control simpanan-title" name="simpanan_title[]" value="{{ $item.title }}" id="simpanan_title_{{ $index }}">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="simpanan_bunga_{{ $index }}" class="form-label">Bunga (%)</label>
                                                    <input type="number" step="0.01" class="form-control simpanan-bunga" name="simpanan_bunga[]" value="{{ $item.bunga }}" id="simpanan_bunga_{{ $index }}">
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-simpanan-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="simpanan_text_{{ $index }}" class="form-label">Deskripsi</label>
                                                <textarea class="form-control simpanan-text" name="simpanan_text[]" rows="3" id="simpanan_text_{{ $index }}">{{ $item.text }}</textarea>
                                            </div>
                                        </div>
                                        {{ end }}
                                    {{ else }}
                                        <!-- Default simpanan items -->
                                        <div class="simpanan-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="simpanan_title_default_0" class="form-label">Nama Jenis Simpanan</label>
                                                    <input type="text" class="form-control simpanan-title" name="simpanan_title[]" value="Simpanan Pokok" id="simpanan_title_default_0">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="simpanan_bunga_default_0" class="form-label">Bunga (%)</label>
                                                    <input type="number" step="0.01" class="form-control simpanan-bunga" name="simpanan_bunga[]" value="0" id="simpanan_bunga_default_0">
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-simpanan-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="simpanan_text_default_0" class="form-label">Deskripsi</label>
                                                <textarea class="form-control simpanan-text" name="simpanan_text[]" rows="3" id="simpanan_text_default_0">Simpanan pokok adalah simpanan wajib yang harus dibayarkan oleh anggota saat bergabung dengan koperasi. Simpanan ini tidak dapat diambil selama menjadi anggota.</textarea>
                                            </div>
                                        </div>
                                        <div class="simpanan-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="simpanan_title_default_1" class="form-label">Nama Jenis Simpanan</label>
                                                    <input type="text" class="form-control simpanan-title" name="simpanan_title[]" value="Simpanan Wajib" id="simpanan_title_default_1">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="simpanan_bunga_default_1" class="form-label">Bunga (%)</label>
                                                    <input type="number" step="0.01" class="form-control simpanan-bunga" name="simpanan_bunga[]" value="2.5" id="simpanan_bunga_default_1">
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-simpanan-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="simpanan_text_default_1" class="form-label">Deskripsi</label>
                                                <textarea class="form-control simpanan-text" name="simpanan_text[]" rows="3" id="simpanan_text_default_1">Simpanan wajib adalah simpanan bulanan yang harus dibayarkan oleh anggota setiap bulan. Simpanan ini mendapatkan bunga sesuai ketentuan koperasi.</textarea>
                                            </div>
                                        </div>
                                        <div class="simpanan-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="simpanan_title_default_2" class="form-label">Nama Jenis Simpanan</label>
                                                    <input type="text" class="form-control simpanan-title" name="simpanan_title[]" value="Simpanan Sukarela" id="simpanan_title_default_2">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="simpanan_bunga_default_2" class="form-label">Bunga (%)</label>
                                                    <input type="number" step="0.01" class="form-control simpanan-bunga" name="simpanan_bunga[]" value="3.0" id="simpanan_bunga_default_2">
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-simpanan-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="simpanan_text_default_2" class="form-label">Deskripsi</label>
                                                <textarea class="form-control simpanan-text" name="simpanan_text[]" rows="3" id="simpanan_text_default_2">Simpanan sukarela adalah simpanan tambahan yang dapat disetor oleh anggota kapan saja. Simpanan ini dapat diambil kapan saja dengan persyaratan tertentu.</textarea>
                                            </div>
                                        </div>
                                    {{ end }}
                                </div>
                                <button type="button" id="add-simpanan-item" class="btn btn-secondary mb-3">Tambah Jenis Simpanan</button>

                                <div class="mb-3">
                                    <label for="keuntungan_title_simpanan" class="form-label">Judul Keuntungan</label>
                                    <input type="text" class="form-control" id="keuntungan_title_simpanan" name="keuntungan_title" value="{{ if .Konten.keuntungan_title }}{{ .Konten.keuntungan_title }}{{ else }}Keuntungan Menabung di Koperasi{{ end }}">
                                </div>
                                <div class="mb-3">
                                    <label for="keuntungan_text_simpanan" class="form-label">Teks Keuntungan</label>
                                    <textarea class="form-control" id="keuntungan_text_simpanan" name="keuntungan_text" rows="4">{{ if .Konten.keuntungan_text }}{{ .Konten.keuntungan_text }}{{ else }}Menabung di koperasi memberikan banyak keuntungan bagi anggota. Selain mendapatkan bunga yang kompetitif, anggota juga turut serta dalam pembangunan ekonomi bersama. Dana yang terkumpul digunakan untuk memberikan pinjaman kepada anggota yang membutuhkan, sehingga tercipta siklus ekonomi yang saling menguntungkan.{{ end }}</textarea>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                                    </button>
                                    <a href="/admin/halaman" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Batal
                                    </a>
                                </div>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer.html" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit_simpanan.js"></script>
</body>
</html>
