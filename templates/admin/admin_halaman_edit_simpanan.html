<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
    <title>KOPMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-content { margin-left: 280px; padding: 20px; transition: margin-left 0.3s ease; }
        @media (max-width: 768px) { .main-content { margin-left: 0; } }
        .page-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }
        .page-header h1 { margin: 0; font-size: 2rem; font-weight: 600; }
        .page-header p { margin: 10px 0 0 0; opacity: 0.9; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); margin-bottom: 20px; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px 12px 0 0 !important; padding: 20px; }
        .form-label { font-weight: 600; color: #2d3748; }
        .form-control, .form-select { border-radius: 8px; border: 2px solid #e2e8f0; padding: 12px 15px; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 12px 30px; border-radius: 8px; font-weight: 600; }
        .btn-danger { padding: 10px 14px; border-radius: 8px; }
        .btn-success { background: #48bb78; border: none; padding: 10px 25px; border-radius: 8px; }
        .btn-success:hover { background: #38a169; }
        .item-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .item-card:hover { border-color: #667eea; }
        .section-actions { margin-top: 10px; }
        .action-card { position: sticky; bottom: 16px; z-index: 5; }
    </style>
</head>
<body>
    {{template "admin_navbar.html" .}}
    <div class="main-content">
        <div class="container-fluid">
            <br><br><br>
            <div class="page-header">
                <h1><i class="fas fa-piggy-bank me-3"></i>Edit Halaman Simpanan</h1>
                <p>Kelola informasi jenis dan manfaat simpanan</p>
            </div>

            <form id="editForm" action="/admin/halaman/update/simpanan" method="POST">
                <input type="hidden" id="konten" name="konten">
                <input type="hidden" id="judul" name="judul" value="{{ .Halaman.Judul }}">
                <div class="card">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-list me-2"></i>Jenis-Jenis Simpanan</h5></div>
                    <div class="card-body">
                        <div id="jenisSimpananContainer"></div>
                        <div class="section-actions">
                            <button type="button" class="btn btn-success" onclick="tambahJenisSimpanan()"><i class="fas fa-plus me-2"></i>Tambah Jenis Simpanan</button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-check-circle me-2"></i>Manfaat Simpanan</h5></div>
                    <div class="card-body">
                        <div id="manfaatContainer"></div>
                        <div class="section-actions">
                            <button type="button" class="btn btn-success" onclick="tambahManfaat()"><i class="fas fa-plus me-2"></i>Tambah Manfaat</button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h5 class="mb-0"><i class="fas fa-file-lines me-2"></i>Formulir Simpanan</h5></div>
                    <div class="card-body">
                        <div id="formulirContainer"></div>
                        <div class="section-actions">
                            <button type="button" class="btn btn-success" onclick="tambahFormulir()"><i class="fas fa-plus me-2"></i>Tambah Field Formulir</button>
                        </div>
                    </div>
                </div>
                <div class="card action-card">
                    <div class="card-body">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Simpan Perubahan</button>
                        <a href="/admin/halaman/edit/simpanan" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Kembali</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
  {{ template "admin_footer" . }}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const kontenData = {{ toJson .Halaman.Konten }};
        let kontenObj;
        try { kontenObj = JSON.parse(kontenData); } catch (e) { kontenObj = { jenis_simpanan: [], manfaat: [] }; }

        function loadJenisSimpanan() {
            const container = document.getElementById('jenisSimpananContainer');
            container.innerHTML = '';
            if (kontenObj.jenis_simpanan) {
                kontenObj.jenis_simpanan.forEach((item, index) => {
                    container.innerHTML += createJenisSimpananHTML(index, item.nama, item.deskripsi);
                });
            }
        }
        function createJenisSimpananHTML(index, nama = '', deskripsi = '') {
            return `<div class="item-card" id="jenis_${index}"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Nama Simpanan</label><input type="text" class="form-control jenis-nama" value="${nama}" placeholder="Contoh: Simpanan Pokok" name="jenis_nama[]"></div><div class="col-md-7"><label class="form-label">Deskripsi</label><input type="text" class="form-control jenis-deskripsi" value="${deskripsi}" placeholder="Deskripsi singkat" name="jenis_deskripsi[]"></div><div class="col-md-1 d-grid"><button type="button" class="btn btn-danger" onclick="hapusJenisSimpanan(${index})"><i class="fas fa-trash"></i></button></div></div></div>`;
        }
        function tambahJenisSimpanan() {
            const container = document.getElementById('jenisSimpananContainer');
            const index = document.querySelectorAll('#jenisSimpananContainer .item-card').length;
            const div = document.createElement('div');
            div.innerHTML = createJenisSimpananHTML(index);
            container.appendChild(div.firstElementChild);
        }
        function hapusJenisSimpanan(index) {
            const element = document.getElementById(`jenis_${index}`);
            if (element) element.remove();
        }
        function loadManfaat() {
            const container = document.getElementById('manfaatContainer');
            container.innerHTML = '';
            if (kontenObj.manfaat) {
                kontenObj.manfaat.forEach((item, index) => {
                    container.innerHTML += createManfaatHTML(index, item);
                });
            }
        }
        function createManfaatHTML(index, text = '') {
            return `<div class="item-card" id="manfaat_${index}"><div class="row g-3 align-items-end"><div class="col-md-11"><label class="form-label">Manfaat ${index + 1}</label><input type="text" class="form-control manfaat-text" value="${text}" placeholder="Tuliskan manfaat simpanan" name="manfaat_text[]"></div><div class="col-md-1 d-grid"><button type="button" class="btn btn-danger" onclick="hapusManfaat(${index})"><i class="fas fa-trash"></i></button></div></div></div>`;
        }
        function tambahManfaat() {
            const container = document.getElementById('manfaatContainer');
            const index = document.querySelectorAll('#manfaatContainer .item-card').length;
            const div = document.createElement('div');
            div.innerHTML = createManfaatHTML(index);
            container.appendChild(div.firstElementChild);
        }
        function hapusManfaat(index) {
            const element = document.getElementById(`manfaat_${index}`);
            if (element) element.remove();
        }

        function createFormulirHTML(index, key = '', label = '', placeholder = '') {
            const selected = (v) => key === v ? 'selected' : '';
            return `<div class="item-card" id="formulir_${index}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">Field</label>
                        <input type="text" class="form-control formulir-key" name="formulir_key[]" value="${key}" placeholder="Contoh: simpanan_wajib">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Label</label>
                        <input type="text" class="form-control formulir-label" value="${label}" placeholder="Contoh: Simpanan Wajib" name="formulir_label[]">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Placeholder / Keterangan</label>
                        <input type="text" class="form-control formulir-placeholder" value="${placeholder}" placeholder="Contoh: 0" name="formulir_placeholder[]">
                    </div>
                    <div class="col-md-1 d-grid">
                        <button type="button" class="btn btn-danger" onclick="hapusFormulir(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
        }
        function loadFormulir() {
            const container = document.getElementById('formulirContainer');
            container.innerHTML = '';
            const forbiddenKeys = new Set(['total_simpanan', 'bukti']);
            const formulir = Array.isArray(kontenObj.formulir_simpanan)
                ? kontenObj.formulir_simpanan.filter(item => item && !forbiddenKeys.has((item.key || '').trim()))
                : [];
            if (formulir.length > 0) {
                formulir.forEach((item, index) => {
                    container.innerHTML += createFormulirHTML(
                        index,
                        item.key || '',
                        item.label || '',
                        item.placeholder || ''
                    );
                });
            } else {
                const defaultFields = [
                    { key: 'simpanan_wajib', label: 'Simpanan Wajib', placeholder: '0' },
                    { key: 'simpanan_sukarela', label: 'Simpanan Sukarela', placeholder: '0' },
                    { key: 'simpanan_hari_raya', label: 'Simpanan Hari Raya', placeholder: '0' },
                    { key: 'simpanan_umroh_haji', label: 'Simpanan Umroh/Haji', placeholder: '0' },
                    { key: 'simpanan_qurban', label: 'Simpanan Qurban', placeholder: '0' }
                ];
                defaultFields.forEach((item, index) => {
                    container.innerHTML += createFormulirHTML(index, item.key, item.label, item.placeholder);
                });
            }
        }
        function tambahFormulir() {
            const container = document.getElementById('formulirContainer');
            const index = document.querySelectorAll('#formulirContainer .item-card').length;
            const div = document.createElement('div');
            div.innerHTML = createFormulirHTML(index);
            container.appendChild(div.firstElementChild);
        }
        function hapusFormulir(index) {
            const element = document.getElementById(`formulir_${index}`);
            if (element) element.remove();
        }
        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const jenisSimpanan = [];
            document.querySelectorAll('#jenisSimpananContainer .item-card').forEach(item => {
                const nama = item.querySelector('.jenis-nama').value;
                const deskripsi = item.querySelector('.jenis-deskripsi').value;
                if (nama && deskripsi) jenisSimpanan.push({ nama, deskripsi });
            });
            const manfaat = [];
            document.querySelectorAll('#manfaatContainer .manfaat-text').forEach(input => {
                if (input.value) manfaat.push(input.value);
            });
            const formulirSimpanan = [];
            const usedKeys = new Set();
            const forbiddenKeys = new Set(['total_simpanan', 'bukti']);
            document.querySelectorAll('#formulirContainer .item-card').forEach(item => {
                const key = item.querySelector('.formulir-key').value.trim();
                const label = item.querySelector('.formulir-label').value.trim();
                const placeholder = item.querySelector('.formulir-placeholder').value.trim();
                if (!key || forbiddenKeys.has(key) || usedKeys.has(key)) return;
                usedKeys.add(key);
                formulirSimpanan.push({ key, label, placeholder });
            });
            const konten = {
                judul: document.getElementById('judul').value,
                jenis_simpanan: jenisSimpanan,
                manfaat: manfaat,
                formulir_simpanan: formulirSimpanan
            };
            document.getElementById('konten').value = JSON.stringify(konten);
            this.submit();
        });
        loadJenisSimpanan();
        loadManfaat();
        loadFormulir();
    </script>
</body>
</html>
