<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Login - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_login.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
        <br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk login sistem</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Login</h5>
                        </div>
                        <div class="card-body">
                            <form>
                                <div class="row mb-3">
                                    <label for="maxLoginAttempts" class="col-sm-4 col-form-label">Maksimal Percobaan Login</label>
                                    <div class="col-sm-8">
                                        <input type="number" class="form-control" id="maxLoginAttempts" value="3" min="1" max="10">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="lockoutDuration" class="col-sm-4 col-form-label">Durasi Blokir (menit)</label>
                                    <div class="col-sm-8">
                                        <input type="number" class="form-control" id="lockoutDuration" value="15" min="1" max="1440">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="passwordExpiry" class="col-sm-4 col-form-label">Kadaluarsa Password (hari)</label>
                                    <div class="col-sm-8">
                                        <input type="number" class="form-control" id="passwordExpiry" value="90" min="30" max="365">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="sessionTimeout" class="col-sm-4 col-form-label">Timeout Sesi (menit)</label>
                                    <div class="col-sm-8">
                                        <input type="number" class="form-control" id="sessionTimeout" value="30" min="5" max="480">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-8 offset-sm-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="twoFactorAuth" checked>
                                            <label class="form-check-label" for="twoFactorAuth">
                                                Aktifkan Otentikasi Dua Faktor
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-8 offset-sm-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="ipWhitelist" checked>
                                            <label class="form-check-label" for="ipWhitelist">
                                                Aktifkan Whitelist IP
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-8 offset-sm-4">
                                        <button type="submit" class="btn btn-primary">Simpan Pengaturan</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_login.js"></script>
</body>
</html>
