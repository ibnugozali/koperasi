<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{if .Title}}{{.Title}} - Koperasi Simpan Pinjam{{else}}Dashboard Admin - Koperasi Simpan Pinjam{{end}}</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>

    {{ template "admin_navbar.html" . }}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br>
            <h2 class="mb-4">Dashboard Admin</h2>

            <!-- Statistik -->
            <div class="row g-4 mb-5">
                <div class="col-lg-3 col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon text-primary"><i class="fa-solid fa-users"></i></div>
                        <div class="stat-number text-primary">{{ .TotalAnggota }}</div>
                        <div class="stat-label">Total Anggota</div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon text-warning"><i class="fa-solid fa-user-clock"></i></div>
                        <div class="stat-number text-warning">{{ .MenungguKonfirmasi }}</div>
                        <div class="stat-label">Menunggu Konfirmasi</div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon text-success"><i class="fa-solid fa-wallet"></i></div>
                        <div class="stat-number text-success">Rp {{ printf "%.0f" .TotalSimpanan }}</div>
                        <div class="stat-label">Total Simpanan</div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6">
                    <div class="stat-card">
                        <div class="stat-icon text-danger"><i class="fa-solid fa-money-bill-wave"></i></div>
                        <div class="stat-number text-danger">Rp {{ printf "%.0f" .TotalPinjaman }}</div>
                        <div class="stat-label">Total Pinjaman</div>
                    </div>
                </div>
            </div>

            <!-- Aktivitas Terbaru - Grafik -->
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <i class="fa-solid fa-chart-line me-2"></i> Aktivitas Terbaru
                        </div>
                        <div class="card-body">
                            <div style="position: relative; height: 400px; width: 100%;">
                                <canvas id="activityChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{ template "admin_footer" . }}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

   <script src="/static/js/admin_dashboard.js"></script>

</body>
