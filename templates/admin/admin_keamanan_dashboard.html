<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Dashboard - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_dashboard.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
     <br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk dashboard anggota</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Dashboard</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Di sini Anda dapat mengatur pengaturan keamanan untuk dashboard anggota, seperti kontrol akses, monitoring aktivitas, dll.</p>

                            <!-- Form pengaturan keamanan dashboard -->
                            <form id="securityForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="sessionTimeout" class="form-label">Timeout Sesi (menit)</label>
                                        <input type="number" class="form-control" id="sessionTimeout" name="sessionTimeout" value="30" min="5" max="120">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="maxLoginAttempts" class="form-label">Maksimal Percobaan Login</label>
                                        <input type="number" class="form-control" id="maxLoginAttempts" name="maxLoginAttempts" value="5" min="3" max="10">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="dataRetention" class="form-label">Retensi Data Aktivitas (hari)</label>
                                        <input type="number" class="form-control" id="dataRetention" name="dataRetention" value="90" min="30" max="365">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="alertThreshold" class="form-label">Threshold Alert (%)</label>
                                        <input type="number" class="form-control" id="alertThreshold" name="alertThreshold" value="80" min="50" max="100">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableTwoFactor" name="enableTwoFactor">
                                        <label class="form-check-label" for="enableTwoFactor">
                                            Aktifkan Two-Factor Authentication
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableActivityLog" name="enableActivityLog" checked>
                                        <label class="form-check-label" for="enableActivityLog">
                                            Aktifkan Log Aktivitas Lengkap
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableAutoLogout" name="enableAutoLogout" checked>
                                        <label class="form-check-label" for="enableAutoLogout">
                                            Aktifkan Auto Logout untuk Sesi Idle
                                        </label>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Pengaturan</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetSettings()"><i class="fas fa-undo me-2"></i> Reset ke Default</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_dashboard.js"></script>
</body>
</html>
