<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Halaman Angsuran - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_angsuran.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">

            <p class="text-muted">Kelola konten halaman <b>{{ .Halaman.Judul }}</b></p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- ANGSURAN -->
                                <div id="angsuran-container">
                                    <h5 class="mb-3">Informasi Angsuran</h5>
                                    {{ if .Konten.informasi_angsuran }}
                                        {{ range $index, $item := .Konten.informasi_angsuran }}
                                        <div class="angsuran-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="angsuran_title_{{ $index }}" class="form-label">Judul Informasi</label>
                                                    <input type="text" class="form-control angsuran-title" name="angsuran_title[]" value="{{ $item.title }}" id="angsuran_title_{{ $index }}">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="angsuran_icon_{{ $index }}" class="form-label">Icon</label>
                                                    <select class="form-control angsuran-icon" name="angsuran_icon[]" id="angsuran_icon_{{ $index }}">
                                                        <option value="fas fa-calendar-check" {{ if eq $item.icon "fas fa-calendar-check" }}selected{{ end }}>Calendar Check</option>
                                                        <option value="fas fa-money-bill-wave" {{ if eq $item.icon "fas fa-money-bill-wave" }}selected{{ end }}>Money Bill</option>
                                                        <option value="fas fa-clock" {{ if eq $item.icon "fas fa-clock" }}selected{{ end }}>Clock</option>
                                                        <option value="fas fa-check-circle" {{ if eq $item.icon "fas fa-check-circle" }}selected{{ end }}>Check Circle</option>
                                                        <option value="fas fa-info-circle" {{ if eq $item.icon "fas fa-info-circle" }}selected{{ end }}>Info Circle</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-angsuran-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="angsuran_text_{{ $index }}" class="form-label">Deskripsi</label>
                                                <textarea class="form-control angsuran-text" name="angsuran_text[]" rows="3" id="angsuran_text_{{ $index }}">{{ $item.text }}</textarea>
                                            </div>
                                        </div>
                                        {{ end }}
                                    {{ else }}
                                        <!-- Default angsuran items -->
                                        <div class="angsuran-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="angsuran_title_default_0" class="form-label">Judul Informasi</label>
                                                    <input type="text" class="form-control angsuran-title" name="angsuran_title[]" value="Pembayaran Tepat Waktu" id="angsuran_title_default_0">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="angsuran_icon_default_0" class="form-label">Icon</label>
                                                    <select class="form-control angsuran-icon" name="angsuran_icon[]" id="angsuran_icon_default_0">
                                                        <option value="fas fa-calendar-check" selected>Calendar Check</option>
                                                        <option value="fas fa-money-bill-wave">Money Bill</option>
                                                        <option value="fas fa-clock">Clock</option>
                                                        <option value="fas fa-check-circle">Check Circle</option>
                                                        <option value="fas fa-info-circle">Info Circle</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-angsuran-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="angsuran_text_default_0" class="form-label">Deskripsi</label>
                                                <textarea class="form-control angsuran-text" name="angsuran_text[]" rows="3" id="angsuran_text_default_0">Anggota diharapkan membayar angsuran sesuai jadwal yang telah ditentukan. Pembayaran tepat waktu akan menjaga kesehatan keuangan koperasi dan memberikan manfaat bagi semua anggota.</textarea>
                                            </div>
                                        </div>
                                        <div class="angsuran-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="angsuran_title_default_1" class="form-label">Judul Informasi</label>
                                                    <input type="text" class="form-control angsuran-title" name="angsuran_title[]" value="Denda Keterlambatan" id="angsuran_title_default_1">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="angsuran_icon_default_1" class="form-label">Icon</label>
                                                    <select class="form-control angsuran-icon" name="angsuran_icon[]" id="angsuran_icon_default_1">
                                                        <option value="fas fa-calendar-check">Calendar Check</option>
                                                        <option value="fas fa-money-bill-wave">Money Bill</option>
                                                        <option value="fas fa-clock" selected>Clock</option>
                                                        <option value="fas fa-check-circle">Check Circle</option>
                                                        <option value="fas fa-info-circle">Info Circle</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-angsuran-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="angsuran_text_default_1" class="form-label">Deskripsi</label>
                                                <textarea class="form-control angsuran-text" name="angsuran_text[]" rows="3" id="angsuran_text_default_1">Pembayaran angsuran yang terlambat akan dikenakan denda sesuai ketentuan koperasi. Denda ini digunakan untuk menutupi biaya administrasi dan memberikan efek jera bagi anggota.</textarea>
                                            </div>
                                        </div>
                                        <div class="angsuran-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="angsuran_title_default_2" class="form-label">Judul Informasi</label>
                                                    <input type="text" class="form-control angsuran-title" name="angsuran_title[]" value="Pelunasan Dipercepat" id="angsuran_title_default_2">
                                                </div>
                                                <div class="col-md-3 mb-2">
                                                    <label for="angsuran_icon_default_2" class="form-label">Icon</label>
                                                    <select class="form-control angsuran-icon" name="angsuran_icon[]" id="angsuran_icon_default_2">
                                                        <option value="fas fa-calendar-check">Calendar Check</option>
                                                        <option value="fas fa-money-bill-wave" selected>Money Bill</option>
                                                        <option value="fas fa-clock">Clock</option>
                                                        <option value="fas fa-check-circle">Check Circle</option>
                                                        <option value="fas fa-info-circle">Info Circle</option>
                                                    </select>
                                                </div>
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-angsuran-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="angsuran_text_default_2" class="form-label">Deskripsi</label>
                                                <textarea class="form-control angsuran-text" name="angsuran_text[]" rows="3" id="angsuran_text_default_2">Anggota dapat melakukan pelunasan pinjaman lebih awal dari jadwal yang ditentukan. Pelunasan dipercepat akan mengurangi beban bunga dan meningkatkan kesehatan keuangan anggota.</textarea>
                                            </div>
                                        </div>
                                    {{ end }}
                                </div>
                                <button type="button" id="add-angsuran-item" class="btn btn-secondary mb-3">Tambah Informasi Angsuran</button>

                                <div class="mb-3">
                                    <label for="panduan_title_angsuran" class="form-label">Judul Panduan</label>
                                    <input type="text" class="form-control" id="panduan_title_angsuran" name="panduan_title" value="{{ if .Konten.panduan_title }}{{ .Konten.panduan_title }}{{ else }}Panduan Pembayaran Angsuran{{ end }}">
                                </div>
                                <div class="mb-3">
                                    <label for="panduan_text_angsuran" class="form-label">Teks Panduan</label>
                                    <textarea class="form-control" id="panduan_text_angsuran" name="panduan_text" rows="6">{{ if .Konten.panduan_text }}{{ .Konten.panduan_text }}{{ else }}Untuk memudahkan anggota dalam melakukan pembayaran angsuran, koperasi menyediakan berbagai cara pembayaran yang dapat dipilih sesuai kebutuhan. Pastikan untuk selalu membawa buku angsuran saat melakukan pembayaran dan memperhatikan tanggal jatuh tempo untuk menghindari denda keterlambatan. Pembayaran dapat dilakukan melalui teller koperasi, transfer bank, atau melalui aplikasi mobile banking.{{ end }}</textarea>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                                    </button>
                                    <a href="/admin/halaman" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Batal
                                    </a>
                                </div>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer.html" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit_angsuran.js"></script>
</body>
</html>
