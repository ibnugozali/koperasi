<!DOCTYPE html>
<html lang="id">
<head>
    <title>Manajemen Halaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Manajemen Halaman Statis</h3>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Judul Halaman</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {{range .AllHalaman}}
            <tr>
                <td>{{.Judul}}</td>
                <td>
                    <a href="/admin/halaman/edit/{{.Slug}}" class="btn btn-primary btn-sm">Edit</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
</body>
</html>
