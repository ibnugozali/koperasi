<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
     <title>KOPMA</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_visi_misi.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br>
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- VISI MISI -->
                                <div class="mb-3">
                                    <label for="visi_visi_misi" class="form-label">Visi</label>
                                    <textarea class="form-control" id="visi_visi_misi" name="visi" rows="5">{{ .Konten.visi }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Misi</label>
                                    <div id="misi-container">
                                        {{ range $index, $misi := .Konten.misi }}
                                        <div class="misi-item mb-2">
                                            <div class="input-group">
                                                <textarea class="form-control misi-input" name="misi[]" rows="2" placeholder="Masukkan poin misi">{{ $misi }}</textarea>
                                                <button type="button" class="btn btn-outline-danger remove-misi" {{ if eq $index 0 }}style="display: none;"{{ end }}>
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        {{ else }}
                                        <div class="misi-item mb-2">
                                            <div class="input-group">
                                                <textarea class="form-control misi-input" name="misi[]" rows="2" placeholder="Masukkan poin misi">Meningkatkan kesejahteraan anggota melalui usaha yang inovatif dan berkelanjutan</textarea>
                                                <button type="button" class="btn btn-outline-danger remove-misi" style="display: none;">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="misi-item mb-2">
                                            <div class="input-group">
                                                <textarea class="form-control misi-input" name="misi[]" rows="2" placeholder="Masukkan poin misi">Menyediakan layanan simpan pinjam yang mudah, cepat, dan transparan</textarea>
                                                <button type="button" class="btn btn-outline-danger remove-misi">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="misi-item mb-2">
                                            <div class="input-group">
                                                <textarea class="form-control misi-input" name="misi[]" rows="2" placeholder="Masukkan poin misi">Mengembangkan program pendidikan dan pelatihan koperasi</textarea>
                                                <button type="button" class="btn btn-outline-danger remove-misi">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="misi-item mb-2">
                                            <div class="input-group">
                                                <textarea class="form-control misi-input" name="misi[]" rows="2" placeholder="Masukkan poin misi">Membangun kemitraan dengan stakeholder untuk kemajuan bersama</textarea>
                                                <button type="button" class="btn btn-outline-danger remove-misi">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                        {{ end }}
                                    </div>
                                    <button type="button" class="btn btn-outline-primary btn-sm" id="add-misi">
                                        <i class="fas fa-plus me-1"></i>Tambah Poin Misi
                                    </button>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                                    </button>
                                    <a href="/admin/halaman/edit/visi-misi" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Batal
                                    </a>
                                </div>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit_visi_misi.js"></script>
</body>
</html>
