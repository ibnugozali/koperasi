<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Pembayaran - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_pembayaran.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
        <br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk data pembayaran anggota</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Pembayaran</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Di sini Anda dapat mengatur pengaturan keamanan untuk data pembayaran, seperti verifikasi pembayaran, notifikasi keamanan, dll.</p>

                            <!-- Form pengaturan keamanan pembayaran -->
                            <form id="securityForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="paymentVerification" class="form-label">Verifikasi Pembayaran</label>
                                        <select class="form-control" id="paymentVerification" name="paymentVerification">
                                            <option value="manual">Manual</option>
                                            <option value="automatic" selected>Otomatis</option>
                                            <option value="hybrid">Hybrid</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="notificationLevel" class="form-label">Tingkat Notifikasi</label>
                                        <select class="form-control" id="notificationLevel" name="notificationLevel">
                                            <option value="low">Rendah</option>
                                            <option value="medium" selected>Sedang</option>
                                            <option value="high">Tinggi</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="maxPaymentAmount" class="form-label">Batas Maksimal Pembayaran (Rp)</label>
                                        <input type="number" class="form-control" id="maxPaymentAmount" name="maxPaymentAmount" value="50000000" min="1000000">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="paymentTimeout" class="form-label">Timeout Pembayaran (menit)</label>
                                        <input type="number" class="form-control" id="paymentTimeout" name="paymentTimeout" value="30" min="5" max="120">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enablePaymentAlerts" name="enablePaymentAlerts" checked>
                                        <label class="form-check-label" for="enablePaymentAlerts">
                                            Aktifkan Alert untuk pembayaran besar
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableFraudDetection" name="enableFraudDetection">
                                        <label class="form-check-label" for="enableFraudDetection">
                                            Aktifkan Deteksi Fraud Otomatis
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enablePaymentLogs" name="enablePaymentLogs" checked>
                                        <label class="form-check-label" for="enablePaymentLogs">
                                            Aktifkan Logging Pembayaran Detail
                                        </label>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Pengaturan</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetSettings()"><i class="fas fa-undo me-2"></i> Reset ke Default</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_pembayaran.js"></script>
</body>
</html>
