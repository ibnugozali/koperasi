<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Logo - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_pengaturan.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br>
            <p class="text-muted">Kelola logo koperasi</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-image me-2"></i>Edit Logo Koperasi</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Upload logo baru untuk koperasi. Format yang didukung: JPG, PNG, GIF. Ukuran maksimal: 2MB.</p>

                            <!-- Current Logo -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h6>Logo Saat Ini</h6>
                                    <div class="border p-3 text-center" style="background-color: #f8f9fa;">
                                        <img id="currentLogo" src="{{.LogoPath}}" alt="Logo Koperasi" class="img-fluid" style="max-width: 200px; max-height: 200px; background-color: transparent;">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <h6>Preview Logo Baru</h6>
                                    <div class="border p-3 text-center" style="background-color: #f8f9fa;">
                                        <img id="previewLogo" src="/static/images/placeholder.png" alt="Preview Logo" class="img-fluid" style="max-width: 200px; max-height: 200px; background-color: transparent;">
                                    </div>
                                </div>
                            </div>

                            <!-- Upload Form -->
                            <form id="uploadLogoForm" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="logoFile" class="form-label">Pilih File Logo</label>
                                    <input type="file" class="form-control" id="logoFile" name="logoFile" accept="image/*" required>
                                    <div class="form-text">Pilih file gambar untuk logo baru.</div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-upload me-2"></i>Upload Logo
                                </button>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load logo saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const savedLogo = localStorage.getItem('currentLogo');
            if (savedLogo) {
                const currentLogo = document.getElementById('currentLogo');
                if (currentLogo) {
                    currentLogo.src = savedLogo;
                }
            }

            // Reset preview logo ke kosong saat halaman dimuat
            const previewLogo = document.getElementById('previewLogo');
            if (previewLogo) {
                previewLogo.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; // 1x1 transparent pixel
                previewLogo.style.backgroundColor = '#f8f9fa';
                delete previewLogo.dataset.canvasData;
            }
        });
    </script>
    <script src="/static/js/admin_logo.js"></script>
</body>
</html>
