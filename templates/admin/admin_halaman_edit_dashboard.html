<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edit Konten Dashboard | KOPMA</title>
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_sejarah.css" rel="stylesheet">
</head>
<body>
    {{template "admin_navbar.html" .}}
    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <p class="text-muted">Kelola konten halaman <b>{{ .Halaman.Judul }}</b></p>
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">
                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>
                                <!-- Konten Dashboard -->
                                <div class="mb-3">
                                    <label for="dashboard_content" class="form-label">Konten Dashboard (HTML diperbolehkan)</label>
                                    <textarea class="form-control" id="dashboard_content" name="dashboard_content" rows="8">{{ index .Konten "dashboard_content" }}</textarea>
                                </div>
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Simpan Perubahan</button>
                                <a href="/admin/dashboard" class="btn btn-secondary ms-2">Batal</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(function() {
        $('#editForm').on('submit', function(e) {
            e.preventDefault();
            var judul = $('#judul_halaman').val();
            var dashboardContent = $('#dashboard_content').val();
            var konten = JSON.stringify({ dashboard_content: dashboardContent });
            $('#konten').val(konten);
            $.ajax({
                url: window.location.pathname,
                method: 'POST',
                data: {
                    judul: judul,
                    konten: konten
                },
                success: function(res) {
                    alert('Konten dashboard berhasil diperbarui!');
                    window.location.href = '/admin/dashboard';
                },
                error: function(xhr) {
                    alert('Gagal menyimpan perubahan: ' + xhr.responseText);
                }
            });
        });
    });
    </script>
</body>
</html>
