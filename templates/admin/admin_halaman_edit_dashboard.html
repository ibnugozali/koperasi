<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
    <title>KOPMA</title>
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_sejarah.css" rel="stylesheet">
    <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>
    {{template "admin_navbar.html" .}}
    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            
            <div class="row">
                <div class="col-12">
                      <br><br><br>
                    <div class="card shadow-sm">   
                        <div class="card-body">
                            {{ if .success }}
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                {{ .success }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            {{ end }}
                            {{ if .error }}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                {{ .error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                            {{ end }}

                            <div class="mb-4 p-3 border rounded">
                                <h6 class="mb-3"><i class="fa-solid fa-file-upload me-2"></i>Template Kop Surat Laporan</h6>
                                <form method="POST" action="/admin/upload-kop" enctype="multipart/form-data" class="d-flex flex-wrap gap-2 align-items-center">
                                    <label for="kop_file" class="form-label mb-0 me-2">Pilih file kop surat:</label>
                                    <input type="file" id="kop_file" name="kop_file" accept=".jpg,.jpeg,.png" class="form-control flex-fill" required autocomplete="off" style="min-width:220px;">
                                    <button type="submit" class="btn btn-primary" style="min-width:170px;">
                                        <i class="fa-solid fa-upload me-2"></i>Upload Template Kop
                                    </button>
                                </form>
                                <small class="text-muted d-block mt-2">Kop surat ini akan dipakai otomatis saat download laporan PDF/Excel.</small>
                                {{ if .CurrentKop }}
                                <div class="mt-1">
                                    <small class="text-muted me-2">File kop aktif:</small>
                                    <a href="{{.CurrentKop}}" target="_blank" class="btn btn-sm btn-outline-primary">
                                        <i class="fa-solid fa-eye me-1"></i>Lihat
                                    </a>
                                </div>
                                {{ end }}
                            </div>

                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">
                                <!-- Konten Dashboard -->
                                <div class="mb-3">
                                    <label for="welcome" class="form-label">Judul Sambutan (welcome)</label>
                                    <input type="text" class="form-control" id="welcome" name="welcome" value="{{ index .Konten "welcome" }}">
                                </div>
                                <div class="mb-3">
                                    <label for="slogan" class="form-label">Slogan</label>
                                    <input type="text" class="form-control" id="slogan" name="slogan" value="{{ index .Konten "slogan" }}">
                                </div>
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Simpan Perubahan</button>
                                <a href="/admin/halaman/edit/dashboard_anggota" class="btn btn-secondary ms-2">Batal</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(function() {
        $('#editForm').on('submit', function(e) {
            e.preventDefault();
            var welcome = $('#welcome').val();
            var slogan = $('#slogan').val();
            var konten = JSON.stringify({ welcome: welcome, slogan: slogan });
            $('#konten').val(konten);
            $.ajax({
                url: '/admin/halaman/update/dashboard_anggota',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    judul: '',
                    konten: konten
                }),
                success: function(res) {
                    alert('Konten dashboard berhasil diperbarui!');
                    window.location.href = '/admin/dashboard';
                },
                error: function(xhr) {
                    alert('Gagal menyimpan perubahan: ' + xhr.responseText);
                }
            });
        });
    });
    </script>
</body>
</html>
