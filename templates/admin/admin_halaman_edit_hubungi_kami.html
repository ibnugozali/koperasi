<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
    <title>KOPMA</title>
    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
       <link href="/static/css/admin_dashboard.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_sejarah.css" rel="stylesheet">
    
</head>
<body>
    {{template "admin_navbar.html" .}}
    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
             <br><br><br>
            <div class="row">
          
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">
                                <!-- Konten Hubungi Kami -->
                                <div class="mb-3">
                                    <label for="alamat" class="form-label">Alamat</label>
                                    <input type="text" class="form-control" id="alamat" name="alamat" value="{{ index .Konten "alamat" }}">
                                </div>
                                <div class="mb-3">
                                    <label for="telepon" class="form-label">Telepon Admin</label>
                                    <input type="text" class="form-control" id="telepon" name="telepon" value="{{ index .Konten "telepon" }}">
                                </div>
                                <div class="mb-3">
                                    <label for="telepon_ketua" class="form-label">Telepon Ketua</label>
                                    <input type="text" class="form-control" id="telepon_ketua" name="telepon_ketua" value="{{ index .Konten "telepon_ketua" }}">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" value="{{ index .Konten "email" }}">
                                </div>
                                <div class="mb-3">
                              
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Simpan Perubahan</button>
                                <a href="/admin/halaman/edit/hubungi_kami" class="btn btn-secondary ms-2">Batal</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(function() {
        $('#editForm').on('submit', function(e) {
            e.preventDefault();
            var judul = $('#judul_halaman').val();
            var alamat = $('#alamat').val();
            var telepon = $('#telepon').val();
            var teleponKetua = $('#telepon_ketua').val();
            var email = $('#email').val();
            var konten = JSON.stringify({ alamat: alamat, telepon: telepon, telepon_ketua: teleponKetua, email: email });
            // Ambil slug dari URL, misal: /admin/halaman/edit/hubungi_kami -> hubungi_kami
            var pathParts = window.location.pathname.split('/');
            var slug = pathParts[pathParts.length - 1];
            var updateUrl = '/admin/halaman/update/' + slug;
            $.ajax({
                url: updateUrl,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    judul: judul,
                    konten: konten
                }),
                success: function(res) {
                    if (res.success) {
                        alert('Konten Hubungi Kami berhasil diperbarui!');
                        window.location.href = '/admin/halaman/edit/hubungi_kami';
                    } else {
                        alert('Gagal menyimpan perubahan: ' + (res.message || 'Unknown error'));
                    }
                },
                error: function(xhr) {
                    var msg = 'Gagal menyimpan perubahan';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        msg += ': ' + xhr.responseJSON.message;
                    } else if (xhr.responseText) {
                        msg += ': ' + xhr.responseText;
                    }
                    alert(msg);
                }
            });
        });
    });
    </script>
</body>
</html>
