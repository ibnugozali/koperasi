<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Riwayat - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_riwayat.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk data riwayat transaksi</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Riwayat</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Di sini Anda dapat mengatur pengaturan keamanan untuk data riwayat transaksi, seperti kontrol akses, enkripsi data, dan monitoring aktivitas.</p>

                            <!-- Form pengaturan keamanan riwayat -->
                            <form id="securityForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="encryptionLevel" class="form-label">Tingkat Enkripsi Data</label>
                                        <select class="form-control" id="encryptionLevel" name="encryptionLevel">
                                            <option value="basic">Dasar (AES-128)</option>
                                            <option value="standard" selected>Standar (AES-256)</option>
                                            <option value="advanced">Lanjutan (AES-512)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="accessControl" class="form-label">Kontrol Akses</label>
                                        <select class="form-control" id="accessControl" name="accessControl">
                                            <option value="admin_only">Admin Saja</option>
                                            <option value="role_based" selected>Berbasis Peran</option>
                                            <option value="user_specific">Spesifik Pengguna</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="auditLogRetention" class="form-label">Retensi Log Audit (hari)</label>
                                        <input type="number" class="form-control" id="auditLogRetention" name="auditLogRetention" value="365" min="30" max="1095">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="backupFrequency" class="form-label">Frekuensi Backup (hari)</label>
                                        <input type="number" class="form-control" id="backupFrequency" name="backupFrequency" value="7" min="1" max="30">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableDataMasking" name="enableDataMasking" checked>
                                        <label class="form-check-label" for="enableDataMasking">
                                            Aktifkan Data Masking untuk Informasi Sensitif
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableIntegrityCheck" name="enableIntegrityCheck" checked>
                                        <label class="form-check-label" for="enableIntegrityCheck">
                                            Aktifkan Pengecekan Integritas Data
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableAnomalyDetection" name="enableAnomalyDetection">
                                        <label class="form-check-label" for="enableAnomalyDetection">
                                            Aktifkan Deteksi Anomali Transaksi
                                        </label>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Pengaturan</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetSettings()"><i class="fas fa-undo me-2"></i> Reset ke Default</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_riwayat.js"></script>
</body>
</html>
