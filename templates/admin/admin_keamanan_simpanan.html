<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Data Simpanan - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_simpanan.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
   <br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk data simpanan anggota</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Data Simpanan</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Di sini Anda dapat mengatur pengaturan keamanan untuk data simpanan, seperti enkripsi data, backup otomatis, dll.</p>

                            <!-- Form pengaturan keamanan data simpanan -->
                            <form id="securityForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="encryptionLevel" class="form-label">Tingkat Enkripsi</label>
                                        <select class="form-control" id="encryptionLevel" name="encryptionLevel">
                                            <option value="basic">Dasar (AES-128)</option>
                                            <option value="standard" selected>Standar (AES-256)</option>
                                            <option value="advanced">Lanjutan (AES-256 + Salt)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="backupFrequency" class="form-label">Frekuensi Backup</label>
                                        <select class="form-control" id="backupFrequency" name="backupFrequency">
                                            <option value="daily">Harian</option>
                                            <option value="weekly" selected>Mingguan</option>
                                            <option value="monthly">Bulanan</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="retentionPeriod" class="form-label">Periode Retensi Data (tahun)</label>
                                        <input type="number" class="form-control" id="retentionPeriod" name="retentionPeriod" value="5" min="1" max="10">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="accessLogRetention" class="form-label">Retensi Log Akses (bulan)</label>
                                        <input type="number" class="form-control" id="accessLogRetention" name="accessLogRetention" value="12" min="3" max="24">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableAuditTrail" name="enableAuditTrail" checked>
                                        <label class="form-check-label" for="enableAuditTrail">
                                            Aktifkan Audit Trail untuk perubahan data
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableDataMasking" name="enableDataMasking">
                                        <label class="form-check-label" for="enableDataMasking">
                                            Aktifkan Data Masking untuk informasi sensitif
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableIntegrityCheck" name="enableIntegrityCheck" checked>
                                        <label class="form-check-label" for="enableIntegrityCheck">
                                            Aktifkan Pengecekan Integritas Data
                                        </label>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Pengaturan</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetSettings()"><i class="fas fa-undo me-2"></i> Reset ke Default</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_simpanan.js"></script>
</body>
</html>
