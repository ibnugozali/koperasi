<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
       <title>KOPMA</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_halaman_edit_sejarah.css" rel="stylesheet">
   <link href="/static/css/admin_dashboard.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <br><br>            
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Edit Halaman: {{ .Halaman.Judul }}</h5>
                        </div>
                        <div class="card-body">
                            <form id="editForm">
                                <input type="hidden" id="konten" name="konten">

                                <!-- Judul Halaman -->
                                <div class="mb-3">
                                    <label for="judul_halaman" class="form-label">Judul Halaman</label>
                                    <input type="text" class="form-control" id="judul_halaman" name="judul" value="{{ .Halaman.Judul }}">
                                </div>

                                <!-- SEJARAH -->
                                <div id="timeline-container">
                                    <h5 class="mb-3">Timeline Sejarah</h5>
                                    {{ if .Konten.timeline }}
                                        {{ range $index, $item := .Konten.timeline }}
                                        <div class="timeline-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="timeline_title_{{ $index }}" class="form-label">Judul Timeline</label>
                                                    <input type="text" class="form-control timeline-title" name="timeline_title[]" value="{{ $item.title }}" id="timeline_title_{{ $index }}">
                                                </div>
                                                <!-- Warna Marker dihapus -->
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-timeline-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="timeline_text_{{ $index }}" class="form-label">Deskripsi</label>
                                                <textarea class="form-control timeline-text" name="timeline_text[]" rows="3" id="timeline_text_{{ $index }}">{{ $item.text }}</textarea>
                                            </div>
                                        </div>
                                        {{ end }}
                                    {{ else }}
                                        <!-- Default timeline items -->
                                        <div class="timeline-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="timeline_title_default_0" class="form-label">Judul Timeline</label>
                                                    <input type="text" class="form-control timeline-title" name="timeline_title[]" value="Pendirian Koperasi (2020)" id="timeline_title_default_0">
                                                </div>
                                                <!-- Warna Marker dihapus -->
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-timeline-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="timeline_text_default_0" class="form-label">Deskripsi</label>
                                                <textarea class="form-control timeline-text" name="timeline_text[]" rows="3" id="timeline_text_default_0">Koperasi Wirya didirikan pada tahun 2020 oleh sekelompok masyarakat yang peduli dengan pemberdayaan ekonomi lokal. Dengan semangat kebersamaan, koperasi ini mulai beroperasi dengan modal awal dari kontribusi anggota pendiri.</textarea>
                                            </div>
                                        </div>
                                        <div class="timeline-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="timeline_title_default_1" class="form-label">Judul Timeline</label>
                                                    <input type="text" class="form-control timeline-title" name="timeline_title[]" value="Pengembangan Layanan (2021)" id="timeline_title_default_1">
                                                </div>
                                                <!-- Warna Marker dihapus -->
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-timeline-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="timeline_text_default_1" class="form-label">Deskripsi</label>
                                                <textarea class="form-control timeline-text" name="timeline_text[]" rows="3" id="timeline_text_default_1">Pada tahun 2021, koperasi mulai mengembangkan layanan simpan pinjam yang lebih komprehensif. Sistem manajemen yang lebih baik diimplementasikan untuk meningkatkan efisiensi dan transparansi operasional.</textarea>
                                            </div>
                                        </div>
                                        <div class="timeline-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="timeline_title_default_2" class="form-label">Judul Timeline</label>
                                                    <input type="text" class="form-control timeline-title" name="timeline_title[]" value="Digitalisasi Layanan (2022)" id="timeline_title_default_2">
                                                </div>
                                                <!-- Warna Marker dihapus -->
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-timeline-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="timeline_text_default_2" class="form-label">Deskripsi</label>
                                                <textarea class="form-control timeline-text" name="timeline_text[]" rows="3" id="timeline_text_default_2">Tahun 2022 menandai era digitalisasi koperasi. Platform online dikembangkan untuk memudahkan anggota mengakses layanan dari mana saja, kapan saja, melalui aplikasi web modern.</textarea>
                                            </div>
                                        </div>
                                        <div class="timeline-item-editor border p-3 mb-3 rounded">
                                            <div class="row">
                                                <div class="col-md-6 mb-2">
                                                    <label for="timeline_title_default_3" class="form-label">Judul Timeline</label>
                                                    <input type="text" class="form-control timeline-title" name="timeline_title[]" value="Pertumbuhan dan Inovasi (2023-Sekarang)" id="timeline_title_default_3">
                                                </div>
                                                <!-- Warna Marker dihapus -->
                                                <div class="col-md-3 mb-2 d-flex align-items-end">
                                                    <button type="button" class="btn btn-danger btn-sm remove-timeline-item">Hapus</button>
                                                </div>
                                            </div>
                                            <div class="mb-2">
                                                <label for="timeline_text_default_3" class="form-label">Deskripsi</label>
                                                <textarea class="form-control timeline-text" name="timeline_text[]" rows="3" id="timeline_text_default_3">Saat ini, Koperasi Wirya terus berkembang dengan fokus pada inovasi layanan dan peningkatan kesejahteraan anggota. Kami berkomitmen untuk menjadi mitra terpercaya dalam membangun ekonomi bersama.</textarea>
                                            </div>
                                        </div>
                                    {{ end }}
                                </div>
                                <button type="button" id="add-timeline-item" class="btn btn-secondary mb-3">Tambah Timeline Item</button>

                                <div class="mb-3">
                                    <label for="komitmen_title_sejarah" class="form-label">Judul Komitmen</label>
                                    <input type="text" class="form-control" id="komitmen_title_sejarah" name="komitmen_title" value="{{ if .Konten.komitmen_title }}{{ .Konten.komitmen_title }}{{ else }}Komitmen Kami{{ end }}">
                                </div>
                                <div class="mb-3">
                                    <label for="komitmen_text_sejarah" class="form-label">Teks Komitmen</label>
                                    <textarea class="form-control" id="komitmen_text_sejarah" name="komitmen_text" rows="4">{{ if .Konten.komitmen_text }}{{ .Konten.komitmen_text }}{{ else }}Koperasi Wirya berkomitmen untuk terus berkembang dan berinovasi dalam memberikan layanan terbaik kepada anggota. Dengan prinsip kebersamaan dan demokrasi, kami berusaha menciptakan dampak positif bagi masyarakat dan ekonomi lokal.{{ end }}</textarea>
                                </div>

                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                                    </button>
                                    <a href="/admin/halaman/edit/sejarah" class="btn btn-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Batal
                                    </a>
                                </div>
                            </form>

                            <!-- Progress Bar -->
                            <div class="progress mt-3" id="uploadProgress" style="display: none;">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer" .}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_halaman_edit_sejarah.js"></script>
</body>
</html>
