<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keamanan Data Pinjaman - Koperasi Simpan Pinjam</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/admin_keamanan_pinjaman.css" rel="stylesheet">
</head>
<body>

    {{template "admin_navbar.html" .}}

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
<br><br>
            <p class="text-muted">Kelola pengaturan keamanan untuk data pinjaman anggota</p>

            <div class="row">
                <div class="col-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-shield-alt me-2"></i>Pengaturan Keamanan Data Pinjaman</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-4">Di sini Anda dapat mengatur pengaturan keamanan untuk data pinjaman, seperti enkripsi data, validasi otomatis, dll.</p>

                            <!-- Form pengaturan keamanan data pinjaman -->
                            <form id="securityForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="encryptionLevel" class="form-label">Tingkat Enkripsi</label>
                                        <select class="form-control" id="encryptionLevel" name="encryptionLevel">
                                            <option value="basic">Dasar (AES-128)</option>
                                            <option value="standard" selected>Standar (AES-256)</option>
                                            <option value="advanced">Lanjutan (AES-256 + Salt)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="validationLevel" class="form-label">Tingkat Validasi</label>
                                        <select class="form-control" id="validationLevel" name="validationLevel">
                                            <option value="basic">Dasar</option>
                                            <option value="standard" selected>Standar</option>
                                            <option value="strict">Ketat</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="retentionPeriod" class="form-label">Periode Retensi Data (tahun)</label>
                                        <input type="number" class="form-control" id="retentionPeriod" name="retentionPeriod" value="7" min="1" max="15">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="auditRetention" class="form-label">Retensi Audit Log (bulan)</label>
                                        <input type="number" class="form-control" id="auditRetention" name="auditRetention" value="24" min="6" max="60">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableAutoValidation" name="enableAutoValidation" checked>
                                        <label class="form-check-label" for="enableAutoValidation">
                                            Aktifkan Validasi Otomatis untuk pengajuan pinjaman
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableRiskAssessment" name="enableRiskAssessment">
                                        <label class="form-check-label" for="enableRiskAssessment">
                                            Aktifkan Penilaian Risiko Otomatis
                                        </label>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enableComplianceCheck" name="enableComplianceCheck" checked>
                                        <label class="form-check-label" for="enableComplianceCheck">
                                            Aktifkan Pengecekan Kepatuhan Regulasi
                                        </label>
                                    </div>
                                </div>
                                <div class="text-end mt-4">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Simpan Pengaturan</button>
                                    <button type="button" class="btn btn-secondary" onclick="resetSettings()"><i class="fas fa-undo me-2"></i> Reset ke Default</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "admin_footer"}}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/admin_keamanan_pinjaman.js"></script>
</body>
</html>
