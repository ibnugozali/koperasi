<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ .Judul }} - Koperasi Wirya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
{{ template "navbar.html" . }}
<div style="padding: 20px;">
<h1>{{ .Judul }}</h1>
    <form action="/pelayanan/pinjamanTentu" method="POST">
        <!-- Bagian 1: Rincian Permohonan Pinjaman -->
        <fieldset class="border p-3 mb-4">
            <legend class="w-auto">Bagian 1: Rincian Permohonan Pinjaman</legend>

            <div class="row">
                <div class="col-md-6" id="gaji_bulanan_container">
                    <div class="mb-3">
                        <label for="gaji_bulanan" class="form-label">Jumlah Gaji Bulanan (Rp)</label>
                        <input type="number" class="form-control" id="gaji_bulanan" name="gaji_bulanan" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="jumlah_pinjaman" class="form-label">Jumlah Pinjaman yang Diajukan (Rp)</label>
                        <input type="number" class="form-control" id="jumlah_pinjaman" name="jumlah_pinjaman" required>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="jumlah_pinjaman_terbilang" class="form-label">Jumlah Pinjaman Terbilang</label>
                <input type="text" class="form-control" id="jumlah_pinjaman_terbilang" name="jumlah_pinjaman_terbilang" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tujuan Penggunaan Pinjaman</label><br>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="tujuan_pinjaman" value="Biaya Pendidikan Anak" id="tujuan1">
                    <label class="form-check-label" for="tujuan1">Biaya Pendidikan Anak</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="tujuan_pinjaman" value="Renovasi Rumah" id="tujuan2">
                    <label class="form-check-label" for="tujuan2">Renovasi Rumah</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="tujuan_pinjaman" value="Pembelian Kendaraan" id="tujuan3">
                    <label class="form-check-label" for="tujuan3">Pembelian Kendaraan</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="tujuan_pinjaman" value="Keperluan Konsumtif" id="tujuan4">
                    <label class="form-check-label" for="tujuan4">Keperluan Konsumtif</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="tujuan_pinjaman" value="Modal Usaha" id="tujuan5">
                    <label class="form-check-label" for="tujuan5">Modal Usaha</label>
                </div>
                <div class="mb-3 mt-2">
                    <label for="tujuan_lain" class="form-label">Lain-lain</label>
                    <input type="text" class="form-control" id="tujuan_lain" name="tujuan_lain">
                </div>
            </div>
            <div class="mb-3">
                <label for="jangka_waktu" class="form-label">Jangka Waktu Pinjaman (Tenor, bulan)</label>
                <select class="form-select" id="jangka_waktu" name="jangka_waktu" required>
                    <option value="">Pilih tenor</option>
                    <option value="12">12 bulan</option>
                    <option value="24">24 bulan</option>
                    <option value="36">36 bulan</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="perkiraan_angsuran" class="form-label">Perkiraan Angsuran per Bulan (Rp)</label>
                <input type="number" class="form-control" id="perkiraan_angsuran" name="perkiraan_angsuran">
            </div>
        </fieldset>

        <!-- Bagian 3: Pernyataan dan Kuasa -->
        <fieldset class="border p-3 mb-4">
            <legend class="w-auto">Bagian 2: Pernyataan dan Kuasa</legend>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="cek_semua" name="cek_semua">
                <label class="form-check-label fw-bold" for="cek_semua">
                    Centang Semua Pernyataan
                </label>
            </div>
            <hr class="my-3">
            <div class="form-check mb-2">
                <input class="form-check-input pernyataan-checkbox" type="checkbox" id="pernyataan_benar" name="pernyataan_benar" required>
                <label class="form-check-label" for="pernyataan_benar">
                    Menyatakan bahwa data yang diberikan adalah benar.
                </label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input pernyataan-checkbox" type="checkbox" id="sanggup_bayar" name="sanggup_bayar" required>
                <label class="form-check-label" for="sanggup_bayar">
                    Sanggup untuk membayar angsuran pinjaman setiap bulan sesuai jadwal.
                </label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input pernyataan-checkbox" type="checkbox" id="setuju_potong_gaji" name="setuju_potong_gaji" required>
                <label class="form-check-label" for="setuju_potong_gaji">
                    Bersedia jika gaji dipotong langsung oleh bendahara gaji universitas untuk pembayaran angsuran.
                </label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input pernyataan-checkbox" type="checkbox" id="kuasa_potong_gaji" name="kuasa_potong_gaji" required>
                <label class="form-check-label" for="kuasa_potong_gaji">
                    Memberikan kuasa kepada pengurus koperasi untuk melakukan pemotongan gaji melalui bendahara.
                </label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input pernyataan-checkbox" type="checkbox" id="kuasa_pakai_simpanan" name="kuasa_pakai_simpanan" required>
                <label class="form-check-label" for="kuasa_pakai_simpanan">
                    Memberikan kuasa kepada koperasi untuk menggunakan simpanan (pokok dan wajib) untuk melunasi sisa pinjaman jika terjadi gagal bayar atau pemohon berhenti bekerja.
                </label>
            </div>
        </fieldset>

       
        <button type="submit" class="btn btn-primary">Ajukan Pinjaman</button>
    </form>
</div>

<script>
// Initialize on page load based on unit kerja
document.addEventListener('DOMContentLoaded', function() {
    const unitKerjaValue = '{{.Anggota.UnitKerja}}';
    const gajiContainer = document.getElementById('gaji_bulanan_container');
    const gajiInput = document.getElementById('gaji_bulanan');

    if (unitKerjaValue === '03') { // Mahasiswa
        gajiContainer.style.display = 'none';
        gajiInput.required = false;
        gajiInput.value = '';
    } else { // Dosen atau Karyawan/Staff
        gajiContainer.style.display = 'block';
        gajiInput.required = true;
    }
});

// Function to handle "Centang Semua" checkbox
document.getElementById('cek_semua').addEventListener('change', function() {
    const checkboxes = document.querySelectorAll('.pernyataan-checkbox');
    checkboxes.forEach(checkbox => {
        checkbox.checked = this.checked;
    });
});

// Function to update "Centang Semua" when individual checkboxes change
document.querySelectorAll('.pernyataan-checkbox').forEach(checkbox => {
    checkbox.addEventListener('change', function() {
        const allCheckboxes = document.querySelectorAll('.pernyataan-checkbox');
        const checkedCheckboxes = document.querySelectorAll('.pernyataan-checkbox:checked');
        const masterCheckbox = document.getElementById('cek_semua');

        if (checkedCheckboxes.length === allCheckboxes.length) {
            masterCheckbox.checked = true;
        } else {
            masterCheckbox.checked = false;
        }
    });
});
</script>

</div>
{{ template "footer.html" . }}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
