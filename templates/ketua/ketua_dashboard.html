<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOPMA</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/bendahara_navbar.css" rel="stylesheet">
    <link href="/static/css/ketua_dashboard.css" rel="stylesheet"> 
    
    {{ template "ketua_navbar.html" . }}

<!-- Main Content -->
<div class="main-content">
    <br><br>
    <div class="container-fluid">
        
<!-- Statistik -->
<div class="row g-4">
    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-primary"><i class="fa-solid fa-users"></i></div>
            <div class="stat-number text-primary">{{len .PendingMembers}}</div>
            <div class="stat-label"><a href="/ketua/anggota" class="text-decoration-none text-primary">Data Anggota</a></div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-warning"><i class="fa-solid fa-user-clock"></i></div>
            <div class="stat-number text-warning">{{len .PendingMembers}}</div>
            <div class="stat-label">Menunggu Konfirmasi</div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-success"><i class="fa-solid fa-wallet"></i></div>
            <div class="stat-number text-success">Rp 45.000.000</div>
            <div class="stat-label">Total Simpanan</div>
        </div>
    </div>

    <div class="col-md-3 col-sm-6">
        <div class="stat-card">
            <div class="stat-icon text-danger"><i class="fa-solid fa-money-bill-wave"></i></div>
            <div class="stat-number text-danger">Rp 120.000.000</div>
            <div class="stat-label">Total Pinjaman</div>
        </div>
    </div>
</div>

<!-- Aktivitas Terbaru - Grafik -->
<div class="mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <i class="fa-solid fa-chart-line"></i> Aktivitas Terbaru
        </div>
        <div class="card-body">
            <canvas id="activityChart" width="400" height="200"></canvas>
        </div>
    </div>
</div>

    </div>
</div>

{{ template "ketua_footer" . }} 

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('activityChart');
    const myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'],
            datasets: [{
                label: 'Data Aktivitas Terbaru',
                data: [12, 19, 3, 5, 2, 3, 5, 4, 7, 8, 9, 10],
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
</body>
</html>
