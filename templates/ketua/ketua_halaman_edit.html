<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Halaman - Koperasi Simpan Pinjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5><i class="fa-solid fa-edit me-2"></i>Edit Halaman: {{.Halaman.Judul}}</h5>
                    </div>
                    <div class="card-body">
                        {{if eq .Halaman.Slug "dashboard_anggota"}}
                        <!-- Special form for dashboard_anggota -->
                        <form action="/bendahara/halaman/update/{{.Halaman.Slug}}" method="post">
                            <div class="mb-3">
                                <label for="teks" class="form-label">Teks Dashboard</label>
                                <textarea class="form-control" id="teks" name="teks" rows="4" required>{{index .Konten "teks"}}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="gambar" class="form-label">URL Gambar</label>
                                <input type="text" class="form-control" id="gambar" name="gambar" value="{{index .Konten "gambar"}}" required>
                            </div>
                            <button type="submit" class="btn btn-success">
                                <i class="fa-solid fa-save"></i> Simpan Perubahan
                            </button>
                        </form>
                        {{else}}
                        <!-- General form for other pages -->
                        <form action="/bendahara/halaman/update/{{.Halaman.Slug}}" method="post">
                            <div class="mb-3">
                                <label for="judul" class="form-label">Judul Halaman</label>
                                <input type="text" class="form-control" id="judul" name="judul" value="{{.Halaman.Judul}}" required>
                            </div>
                            <div class="mb-3">
                                <label for="konten" class="form-label">Konten Halaman</label>
                                <textarea class="form-control" id="konten" name="konten" rows="10" required>{{.Halaman.Konten}}</textarea>
                            </div>
                            <button type="submit" class="btn btn-success">
                                <i class="fa-solid fa-save"></i> Simpan Perubahan
                            </button>
                        </form>
                        {{end}}
                        <div class="mt-3">
                            <a href="/bendahara/halaman" class="btn btn-secondary">
                                <i class="fa-solid fa-arrow-left"></i> Kembali
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
