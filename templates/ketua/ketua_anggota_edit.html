<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Anggota - Koperasi Simpan Pinjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5><i class="fa-solid fa-edit me-2"></i>Edit Anggota</h5>
                    </div>
                    <div class="card-body">
                        <form action="/ketua/anggota/update/{{.Anggota.IDAnggota}}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="nama_anggota" class="form-label">Nama Anggota</label>
                                        <input type="text" class="form-control" id="nama_anggota" name="nama_anggota" value="{{.Anggota.NamaAnggota}}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" name="username" value="{{.Anggota.Username}}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="tgl_lahir" class="form-label">Tanggal Lahir</label>
                                        <input type="date" class="form-control" id="tgl_lahir" name="tgl_lahir" value="{{if .Anggota.TglLahir}}{{.Anggota.TglLahir.Format "2006-01-02"}}{{end}}">
                                    </div>
                                    <div class="mb-3">
                                        <label for="nik_ktp" class="form-label">NIK/KTP</label>
                                        <input type="text" class="form-control" id="nik_ktp" name="nik_ktp" value="{{.Anggota.NikKTP}}">
                                    </div>
                                    <div class="mb-3">
                                        <label for="no_telepon" class="form-label">No. Telepon</label>
                                        <input type="text" class="form-control" id="no_telepon" name="no_telepon" value="{{.Anggota.NoTelepon}}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="provinsi" class="form-label">Provinsi</label>
                                        <input type="text" class="form-control" id="provinsi" name="provinsi" value="{{.Anggota.Provinsi}}">
                                    </div>
                                    <div class="mb-3">
                                        <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
                                        <select class="form-control" id="jenis_kelamin" name="jenis_kelamin">
                                            <option value="Laki-laki" {{if eq .Anggota.JenisKelamin "Laki-laki"}}selected{{end}}>Laki-laki</option>
                                            <option value="Perempuan" {{if eq .Anggota.JenisKelamin "Perempuan"}}selected{{end}}>Perempuan</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="status_anggota" class="form-label">Status Anggota</label>
                                        <select class="form-control" id="status_anggota" name="status_anggota">
                                            <option value="aktif" {{if eq .Anggota.StatusAnggota "aktif"}}selected{{end}}>Aktif</option>
                                            <option value="nonaktif" {{if eq .Anggota.StatusAnggota "nonaktif"}}selected{{end}}>Nonaktif</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="fakultas" class="form-label">Fakultas</label>
                                        <input type="text" class="form-control" id="fakultas" name="fakultas" value="{{.Anggota.Fakultas}}">
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button type="submit" class="btn btn-success">
                                    <i class="fa-solid fa-save"></i> Simpan Perubahan
                                </button>
                                <a href="/ketua/anggota/{{.Anggota.IDAnggota}}" class="btn btn-secondary">
                                    <i class="fa-solid fa-arrow-left"></i> Batal
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
