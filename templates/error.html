
{{define "error.html"}}
{{template "base.html" .}}
{{end}}

{{define "content"}}
<div class="error-container" style="background:#fff;padding:40px 30px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);text-align:center;margin:60px auto;max-width:400px;">
    <div class="error-icon" style="font-size:3rem;color:#e53e3e;margin-bottom:15px;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <div class="error-message" style="font-size:1.2rem;color:#2d3748;margin-bottom:10px;">
        {{if .Error}}{{.Error}}{{else}}{{.message}}{{end}}
    </div>
    <a href="/" class="btn btn-primary mt-3">Kembali ke Beranda</a>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
{{end}}
