<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>KOPMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    .dropdown-submenu {
      position: relative;
    }
    .dropdown-submenu > .dropdown-menu {
      top: 0;
      left: 100%;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body class="bg-light">

{{ template "navbar.html" . }}

    
<div class="container mt-4">
  <div class="card">
    

<main class="container-fluid py-4 d-flex flex-column" style="min-height: 80vh; position: relative;">
    <div class="row justify-content-center align-items-center flex-grow-1">
        <div class="col-12 text-center">
            <h2 class="mb-4">{{ .KontenParsed.welcome }}</h2>
            <p class="fw-bold fs-4">{{ .KontenParsed.slogan }}</p>
        </div>
    </div>
    <div class="position-absolute bottom-0 start-0 p-3">
        <p>Halo, <strong>{{ .Anggota.NamaAnggota }}</strong>! Terima kasih telah menjadi bagian dari keluarga besar Koperasi Wirya</p>
    </div>
</main>
</div>
</div>
  </div>
  
{{ template "footer.html" . }}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
