<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
      <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
    <title>KOPMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    .dropdown-submenu {
      position: relative;
    }
    .dropdown-submenu > .dropdown-menu {
      top: 0;
      left: 100%;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body class="bg-light">

{{ template "navbar.html" . }}
<main class="container py-4">
    <div class="card">
        <div class="card-body">
            <h1>{{ .Title }}</h1>
            {{ if .Error }}
            <div class="alert alert-danger">{{ .Error }}</div>
            {{ end }}
            {{ if .Success }}
            <div class="alert alert-success">{{ .Success }}</div>
            {{ end }}
            <form method="POST" action="/anggota/ganti-password">
                <div class="mb-3">
                  <label for="old_password" class="form-label">Password Lama</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="old_password" name="old_password" value="{{ .Anggota.Password }}" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('old_password')">
                      <i class="bi bi-eye" id="old_password_icon"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="new_username" class="form-label">Username Baru (Opsional)</label>
                  <input type="text" class="form-control" id="new_username" name="new_username" value="{{ .Anggota.Username }}" autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">Password Baru (Opsional)</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="new_password" name="new_password" autocomplete="new-password">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password')">
                            <i class="bi bi-eye" id="new_password_icon"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Konfirmasi Password Baru (Opsional)</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password')">
                            <i class="bi bi-eye" id="confirm_password_icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                <a href="/anggota/dashboard" class="btn btn-secondary">Kembali ke Dashboard</a>
            </form>
        </div>
    </div>
</main>

<form id="logout-form" action="/logout" method="POST" style="display:none;"></form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function togglePassword(fieldId) {
  const input = document.getElementById(fieldId);
  const icon = document.getElementById(fieldId + '_icon');

  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}

document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll('.dropdown-submenu > a.dropdown-toggle').forEach(function(element){
    element.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      let submenu = this.nextElementSibling;
      if (submenu) {
        this.closest('.dropdown-menu').querySelectorAll('.dropdown-menu.show').forEach(function(menu){
          if(menu !== submenu) {
            menu.classList.remove('show');
          }
        });
        submenu.classList.toggle('show');
      }
    });
  });


});
</script>
  {{ template "footer.html" . }}
</body>
</html>
