<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ajukan Pinjaman - Koperasi Wirya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .dropdown-submenu {
      position: relative;
    }
    .dropdown-submenu > .dropdown-menu {
      top: 0;
      left: 100%;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body class="bg-light">

{{ template "navbar.html" . }}

<main class="container py-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title mb-0">Ajukan Pinjaman</h5>
        </div>
        <div class="card-body">
          {{ if .Error }}
          <div class="alert alert-danger" role="alert">
            {{ .Error }}
          </div>
          {{ end }}
          {{ if .Success }}
          <div class="alert alert-success" role="alert">
            {{ .Success }}
          </div>
          {{ end }}
          <form method="POST" action="/anggota/ajukan-pinjaman">
            <div class="mb-3">
              <label for="JumlahPinjaman" class="form-label">Jumlah Pinjaman (Rp)</label>
              <input type="number" class="form-control" id="JumlahPinjaman" name="JumlahPinjaman" min="1000000" step="100000" required>
              <div class="form-text">Minimal pinjaman Rp 1.000.000</div>
            </div>
            <div class="mb-3">
              <label for="JangkaWaktu" class="form-label">Jangka Waktu (Bulan)</label>
              <select class="form-select" id="JangkaWaktu" name="JangkaWaktu" required>
                <option value="">Pilih Jangka Waktu</option>
                <option value="6">6 Bulan</option>
                <option value="12">12 Bulan</option>
                <option value="18">18 Bulan</option>
                <option value="24">24 Bulan</option>
                <option value="36">36 Bulan</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="Bunga" class="form-label">Bunga (% per tahun)</label>
              <input type="number" class="form-control" id="Bunga" name="Bunga" min="0" max="20" step="0.1" required>
              <div class="form-text">Bunga maksimal 20% per tahun</div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Ajukan Pinjaman</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

{{ template "footer.html" . }}

<form id="logout-form" action="/logout" method="POST" style="display:none;"></form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll('.dropdown-submenu > a.dropdown-toggle').forEach(function(element){
    element.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      let submenu = this.nextElementSibling;
      if (submenu) {
        this.closest('.dropdown-menu').querySelectorAll('.dropdown-menu.show').forEach(function(menu){
          if(menu !== submenu) {
            menu.classList.remove('show');
          }
        });
        submenu.classList.toggle('show');
      }
    });
  });
});
</script>
</body>
</html>
