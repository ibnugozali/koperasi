<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ .Judul }} - Koperasi Wirya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
{{ template "navbar.html" . }}
<div style="padding: 20px;">
<div class="container mt-4">
  <div class="card">
      <div class="card-body p-4 p-md-5 bg-white">
      <h1 class="card-title mb-4">{{ .Judul }}</h1>
      <hr>
        <div class="mt-4">

<form action="/anggota/angsuran" method="POST" enctype="multipart/form-data" style="max-width: 600px; margin: auto;">
<div style="margin-bottom: 10px;">
<label>Jumlah Angsuran (Rp)</label><br>
<input type="number" name="jumlah_angsuran" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
</div>
<div style="margin-bottom: 10px;">
<label>Tanggal Pembayaran</label><br>
<input type="date" name="tanggal_pembayaran" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
</div>
<div style="margin-bottom: 10px;">
<label>Metode Pembayaran</label><br>
<select name="metode_pembayaran" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
<option value="">Pilih metode</option>
<option value="Transfer">Transfer Bank</option>
<option value="Tunai">Tunai</option>
<option value="Potong Gaji">Potong Gaji</option>
</select>
</div>
<div style="margin-bottom: 10px;">
<label for="bukti" class="form-label">Bukti Pembayaran</label>
<input type="file" class="form-control" id="bukti" name="bukti" accept="image/*" required>
</div>
<input type="submit" value="Kirim Simpanan" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
</form>
</div>
</div>
</div>

{{ template "footer.html" . }}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
