<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota - Koperasi Simpan Pinjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h3 class="card-title text-center mb-4">Formulir Pendaftaran Anggota</h3>
                        {{ if .error }}
                            <div class="alert alert-danger">{{ .error }}</div>
                        {{ end }}
                        <form action="/register" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="nama_anggota" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama_anggota" name="NamaAnggota" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Nama Pengguna</label>
                                    <input type="text" class="form-control" id="username" name="Username" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Kata Sandi</label>
                                    <input type="password" class="form-control" id="password" name="Password" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nik_ktp" class="form-label">NIK KTP</label>
                                    <input type="text" class="form-control" id="nik_ktp" name="NikKTP" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="no_telepon" class="form-label">No. Telepon</label>
                                    <input type="text" class="form-control" id="no_telepon" name="NoTelepon" required>
                                </div>
                            </div>
                             <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tgl_lahir" class="form-label">Tanggal Lahir</label>
                                    <input type="date" class="form-control" id="tgl_lahir" name="TglLahir" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
                                    <select class="form-select" id="jenis_kelamin" name="JenisKelamin">
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>
                            </div>

                           <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="status_anggota" class="form-label">Unit Kerja</label>
                                    <select class="form-select" id="status_anggota" name="StatusAnggota" required>
                                        <option value="">Pilih Status</option>
                                        <option value="dosen">Dosen</option>
                                        <option value="karyawan">Karyawan / Staff</option>
                                        <option value="mahasiswa">Mahasiswa</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fakultas" class="form-label">Fakultas</label>
                                    <select class="form-select" id="fakultas" required>
                                        <option value="">Pilih Fakultas</option>
                                        <option value="Fakultas Agama Islam (FAI)">Fakultas Agama Islam (FAI)</option>
                                        <option value="Fakultas Ekonomi (FE)">Fakultas Ekonomi (FE)</option>
                                        <option value="Fakultas Hukum (FH)">Fakultas Hukum (FH)</option>
                                        <option value="Fakultas Ilmu Sosial dan Ilmu Politik (FISIP)">Fakultas Ilmu Sosial dan Ilmu Politik (FISIP)</option>
                                        <option value="Fakultas Keguruan dan Ilmu Pendidikan (FKIP)">Fakultas Keguruan dan Ilmu Pendidikan (FKIP)</option>
                                        <option value="Fakultas Kesehatan Masyarakat (FKM)">Fakultas Kesehatan Masyarakat (FKM)</option>
                                        <option value="Fakultas Pertanian (FAPERTA)">Fakultas Pertanian (FAPERTA)</option>
                                        <option value="Fakultas Teknik (FT)">Fakultas Teknik (FT)</option>
                                        <option value="Rektorat / Yayasan" id="option_rektorat">Rektorat / Yayasan / Staff</option>
                                    </select>
                                    <input type="hidden" id="fakultas_hidden" name="Fakultas">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="gaji_bulanan" class="form-label">Gaji Bulanan</label>
                                <input type="number" class="form-control" id="gaji_bulanan" name="GajiBulanan" placeholder="Contoh: 5000000" min="0" step="1000" required>
                                <small class="form-text text-muted">Masukkan gaji bulanan dalam Rupiah (tanpa titik atau koma)</small>
                            </div>
                            <div class="mb-3">
                                <label for="bukti_transfer" class="form-label">Bukti Transfer Simpanan Pokok Wajib Rp. {{ .NominalSimpanan }},-</label>
                                <input type="file" class="form-control" id="bukti_transfer" name="BuktiTransfer" accept="image/*,.pdf" required>
                                <small class="form-text text-muted">
                                    Upload bukti transfer/pembayaran (format gambar) | 
                                    <strong>Nomor rekening koperasi: {{ .NomorRekening }}</strong>
                                </small>
                            </div>
                            <div class="mb-3">
                                <label for="alamat" class="form-label">Alamat</label>
                                <input type="text" class="form-control" id="alamat" name="Alamat" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Daftar</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Sudah punya akun? <a href="/login">Login</a></p>
                        </div>
                    </div>
                    <div class="card-footer text-center">
          <small>&copy; 2025 | Gozali</small>
        </div>
                </div>
            </div>
        </div>
    </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <script>
        // Fungsi untuk mengatur status kolom Gaji Bulanan dan Fakultas berdasarkan Unit Kerja
        const statusAnggotaSelect = document.getElementById('status_anggota');
        const gajiBulananInput = document.getElementById('gaji_bulanan');
        const fakultasSelect = document.getElementById('fakultas');
        const fakultasHidden = document.getElementById('fakultas_hidden');
        const optionRektorat = document.getElementById('option_rektorat');
        const registerForm = document.querySelector('form');
        
        // Update hidden input setiap kali fakultas berubah
        fakultasSelect.addEventListener('change', function() {
            fakultasHidden.value = fakultasSelect.value;
        });
        
        // Pastikan hidden input terisi saat form submit
        registerForm.addEventListener('submit', function(e) {
            // Update hidden input dengan nilai terkini dari select
            fakultasHidden.value = fakultasSelect.value;
            
            // Validasi fakultas tidak boleh kosong
            if (!fakultasHidden.value) {
                e.preventDefault();
                alert('Silakan pilih fakultas terlebih dahulu');
                return false;
            }
        });
        
        function updateGajiBulananStatus() {
            const selectedValue = statusAnggotaSelect.value;
            
            if (selectedValue === 'mahasiswa') {
                // Jika mahasiswa, disable input gaji dan set value ke 0
                gajiBulananInput.disabled = true;
                gajiBulananInput.value = '0';
                gajiBulananInput.required = false;
                gajiBulananInput.classList.add('bg-light');
                
                // Sembunyikan opsi Rektorat/Yayasan
                optionRektorat.style.display = 'none';
                optionRektorat.disabled = true;
                // Reset fakultas jika sebelumnya Rektorat
                if (fakultasSelect.value === 'Rektorat / Yayasan') {
                    fakultasSelect.value = '';
                }
                fakultasSelect.disabled = false;
                fakultasSelect.classList.remove('bg-light');
                fakultasHidden.value = fakultasSelect.value;
            } else if (selectedValue === 'dosen') {
                // Jika dosen, enable input gaji
                gajiBulananInput.disabled = false;
                gajiBulananInput.required = true;
                gajiBulananInput.classList.remove('bg-light');
                if (gajiBulananInput.value === '0') {
                    gajiBulananInput.value = '';
                }
                
                // Sembunyikan opsi Rektorat/Yayasan
                optionRektorat.style.display = 'none';
                optionRektorat.disabled = true;
                // Reset fakultas jika sebelumnya Rektorat
                if (fakultasSelect.value === 'Rektorat / Yayasan') {
                    fakultasSelect.value = '';
                }
                fakultasSelect.disabled = false;
                fakultasSelect.classList.remove('bg-light');
                fakultasHidden.value = fakultasSelect.value;
            } else if (selectedValue === 'karyawan') {
                // Jika karyawan, enable input gaji
                gajiBulananInput.disabled = false;
                gajiBulananInput.required = true;
                gajiBulananInput.classList.remove('bg-light');
                if (gajiBulananInput.value === '0') {
                    gajiBulananInput.value = '';
                }
                
                // Tampilkan opsi Rektorat/Yayasan
                optionRektorat.style.display = 'block';
                optionRektorat.disabled = false;
                // Otomatis pilih Rektorat / Yayasan
                fakultasSelect.value = 'Rektorat / Yayasan';
                fakultasSelect.disabled = true;
                fakultasSelect.classList.add('bg-light');
                // Set hidden input
                fakultasHidden.value = 'Rektorat / Yayasan';
            } else {
                // Default state (belum pilih unit kerja)
                gajiBulananInput.disabled = false;
                gajiBulananInput.required = true;
                gajiBulananInput.classList.remove('bg-light');
                
                fakultasSelect.disabled = false;
                fakultasSelect.classList.remove('bg-light');
                optionRektorat.style.display = 'block';
                optionRektorat.disabled = false;
                fakultasHidden.value = fakultasSelect.value;
            }
        }
        
        // Event listener saat dropdown berubah
        statusAnggotaSelect.addEventListener('change', updateGajiBulananStatus);
        
        // Jalankan saat halaman dimuat untuk set status awal
        updateGajiBulananStatus();
      </script>
</body>
</html>
