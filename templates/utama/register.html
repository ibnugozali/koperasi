<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota - Koperasi Simpan Pinjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h3 class="card-title text-center mb-4">Formulir Pendaftaran Anggota</h3>
                        {{ if .error }}
                            <div class="alert alert-danger">{{ .error }}</div>
                        {{ end }}
                        <form action="/register" method="POST">
                            <div class="mb-3">
                                <label for="nama_anggota" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama_anggota" name="NamaAnggota" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="Username" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="Password" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nik_ktp" class="form-label">NIK KTP</label>
                                    <input type="text" class="form-control" id="nik_ktp" name="NikKTP" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="no_telepon" class="form-label">No. Telepon</label>
                                    <input type="text" class="form-control" id="no_telepon" name="NoTelepon" required>
                                </div>
                            </div>
                             <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tgl_lahir" class="form-label">Tanggal Lahir</label>
                                    <input type="date" class="form-control" id="tgl_lahir" name="TglLahir" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
                                    <select class="form-select" id="jenis_kelamin" name="JenisKelamin">
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>
                            </div>

                           <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="status_anggota" class="form-label">Status Anggota</label>
                                    <select class="form-select" id="status_anggota" name="StatusAnggota" required>
                                        <option value="">Pilih Status</option>
                                        <option value="dosen">Dosen</option>
                                        <option value="karyawan">Karyawan</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fakultas" class="form-label">Fakultas</label>
                                    <select class="form-select" id="fakultas" name="Fakultas" required>
                                        <option value="">Pilih Fakultas</option>
                                        <option value="Fakultas Agama Islam (FAI)">Fakultas Agama Islam (FAI)</option>
                                        <option value="Fakultas Ekonomi (FE)">Fakultas Ekonomi (FE)</option>
                                        <option value="Fakultas Hukum (FH)">Fakultas Hukum (FH)</option>
                                        <option value="Fakultas Ilmu Sosial dan Ilmu Politik (FISIP)">Fakultas Ilmu Sosial dan Ilmu Politik (FISIP)</option>
                                        <option value="Fakultas Keguruan dan Ilmu Pendidikan (FKIP)">Fakultas Keguruan dan Ilmu Pendidikan (FKIP)</option>
                                        <option value="Fakultas Kesehatan Masyarakat (FKM)">Fakultas Kesehatan Masyarakat (FKM)</option>
                                        <option value="Fakultas Pertanian (FAPERTA)">Fakultas Pertanian (FAPERTA)</option>
                                        <option value="Fakultas Teknik (FT)">Fakultas Teknik (FT)</option>
                                    </select>
                                </div>
                                 <div class="mb-3">
                                <label for="provinsi" class="form-label">Provinsi</label>
                                <input type="text" class="form-control" id="provinsi" name="Provinsi">
                            </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Daftar</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p>Sudah punya akun? <a href="/login">Login di sini</a></p>
                        </div>
                    </div>
                    <div class="card-footer text-center">
          <small>&copy; 2025 | Gozali</small>
        </div>
                </div>
            </div>
        </div>
    </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
