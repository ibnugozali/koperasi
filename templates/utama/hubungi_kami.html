<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>{{if .CurrentLogoName}}{{.CurrentLogoName}}{{else}}KSP{{end}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    .dropdown-submenu {
      position: relative;
    }
    .dropdown-submenu > .dropdown-menu {
      top: 0;
      left: 100%;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body class="bg-light">

{{ template "navbar.html" . }}
<main class="container py-4">
    <div class="card">
        <div class="card-body">
            <h1>{{ .Judul }}</h1>
            <p>Silakan hubungi kami untuk informasi lebih lanjut.</p>
            <p>Email: info@koperasiwirya.com</p>
            <p>Telepon: 08123456789</p>
        </div>
    </div>
</main>

<form id="logout-form" action="/logout" method="POST" style="display:none;"></form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll('.dropdown-submenu > a.dropdown-toggle').forEach(function(element){
    element.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      let submenu = this.nextElementSibling;
      if (submenu) {
        this.closest('.dropdown-menu').querySelectorAll('.dropdown-menu.show').forEach(function(menu){
          if(menu !== submenu) {
            menu.classList.remove('show');
          }
        });
        submenu.classList.toggle('show');
      }
    });
  });
});
</script>
  {{ template "footer.html" . }}
</body>
</html>
