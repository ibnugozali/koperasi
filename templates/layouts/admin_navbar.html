<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <i class="fas fa-piggy-bank"></i>
        </div>
        <div class="sidebar-title">Koperasi Simpan Pinjam</div>
        <small>Administrator</small>
    </div>

    <div class="sidebar-menu">
        <div class="sidebar-item {{ if eq .ActivePage "dashboard" }}active{{ end }}" onclick="window.location.href='/admin/dashboard'">
            <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "konfirmasi" }}active{{ end }}" onclick="window.location.href='/admin/konfirmasi'">
            <i class="fas fa-user-check"></i> <span>Konfirmasi Anggota</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "anggota" }}active{{ end }}" onclick="window.location.href='/admin/anggota'">
            <i class="fas fa-users"></i> <span>Data Anggota</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "transaksi" }}active{{ end }}" onclick="showSection('transaksi')">
            <i class="fas fa-exchange-alt"></i> <span>Transaksi</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "laporan" }}active{{ end }}" onclick="showSection('laporan')">
            <i class="fas fa-chart-bar"></i> <span>Laporan Keuangan</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "halaman" }}active{{ end }}" onclick="window.location.href='/admin/halaman'">
            <i class="fas fa-file-alt"></i> <span>Halaman Statis</span>
        </div>

        <div class="sidebar-item {{ if eq .ActivePage "setting" }}active{{ end }}" onclick="showSection('setting')">
            <i class="fas fa-cog"></i> <span>Setting</span>
        </div>

        <div class="sidebar-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> <span>Keluar</span>
        </div>
    </div>
</div>

<script>
    function showSection(section) {
        alert('Tampilkan bagian: ' + section);
    }

    function logout() {
        if (confirm('Yakin ingin keluar?')) {
            window.location.href = '/logout';
        }
    }
