{{define "admin_navbar.html"}}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <button class="hamburger me-3" onclick="toggleSidebar()" style="padding:6px 12px;background:#004aad;color:#fff;">
            <i class="fas fa-bars"></i>
        </button>
        <span class="navbar-brand fw-bold">Dasbor Administrator</span>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="text-center mb-3" style="padding-top:56px;">
        <img id="navbarLogo" src="{{if .LogoPath}}{{.LogoPath}}{{else}}/static/images/placeholder.png{{end}}" alt="Logo Koperasi" class="img-fluid" style="max-width: 80px; background-color: transparent;" onerror="this.src='/static/images/placeholder.png'">
                <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
        <h5 class="mt-2">KOPMA</h5>
    </div>
    <a href="/admin/dashboard" class="{{ if eq .ActivePage "dashboard" }}active{{ end }}"><i class="fa-solid fa-gauge me-2"></i> Dasbor</a>
    <a href="/admin/anggota" class="{{ if eq .ActivePage "anggota" }}active{{ end }}"><i class="fa-solid fa-users me-2"></i> Data Anggota</a>
    <a href="/admin/laporan" class="{{ if eq .ActivePage "laporan" }}active{{ end }}"><i class="fa-solid fa-file-lines me-2"></i> Laporan</a>

    <!-- Manajemen Website -->
    <a href="#" onclick="toggleSubmenu(this, 'kontenWebsite'); return false;" class="dropdown-toggle"><i class="fa-solid fa-globe me-2"></i> Manajemen Website</a>
    <div class="collapse {{ if or (eq .ActivePage "sejarah") (eq .ActivePage "visi-misi") (eq .ActivePage "struktur") (eq .ActivePage "halaman") (eq .ActivePage "hubungi_kami") (eq .ActivePage "dashboard_content") (eq .ActivePage "edit_simpanan") (eq .ActivePage "edit_tanda_tangan") (eq .ActivePage "edit_logo") }}show{{ end }}" id="kontenWebsite" {{ if or (eq .ActivePage "sejarah") (eq .ActivePage "visi-misi") (eq .ActivePage "struktur") (eq .ActivePage "halaman") (eq .ActivePage "hubungi_kami") (eq .ActivePage "dashboard_content") (eq .ActivePage "edit_simpanan") (eq .ActivePage "edit_tanda_tangan") (eq .ActivePage "edit_logo") }}style="display: block;"{{ end }}>
        <a href="/admin/halaman/edit/sejarah" class="ms-3 {{ if eq .ActivePage "sejarah" }}active{{ end }}"><i class="fa-solid fa-history me-2"></i> Sejarah</a>
        <a href="/admin/halaman/edit/visi-misi" class="ms-3 {{ if eq .ActivePage "visi_misi" }}active{{ end }}"><i class="fa-solid fa-eye me-2"></i> Visi & Misi </a>
        <a href="/admin/halaman/edit/struktur" class="ms-3 {{ if eq .ActivePage "struktur" }}active{{ end }}"><i class="fa-solid fa-sitemap me-2"></i> Struktur Organisasi</a>
        <a href="/admin/halaman/edit/hubungi_kami" class="ms-3 {{ if eq .ActivePage "hubungi_kami" }}active{{ end }}"><i class="fa-solid fa-phone me-2"></i> Hubungi Kami</a>
        <a href="/admin/halaman/edit/simpanan" class="ms-3 {{ if eq .ActivePage "edit_simpanan" }}active{{ end }}"><i class="fa-solid fa-piggy-bank me-2"></i> Halaman Simpanan</a>
        <a href="/admin/halaman/edit/dashboard_anggota" class="ms-3 {{ if eq .ActivePage "dashboard_content" }}active{{ end }}"><i class="fa-solid fa-desktop me-2"></i> Kop Surat & Dashboard Anggota</a>
        <a href="/admin/tanda-tangan" class="ms-3 {{ if eq .ActivePage "edit_tanda_tangan" }}active{{ end }}"><i class="fa-solid fa-signature me-2"></i> Tanda Tangan</a>
        <a href="/admin/edit-logo" class="ms-3 {{ if eq .ActivePage "edit_logo" }}active{{ end }}"><i class="fa-solid fa-image me-2"></i> Logo</a>
    </div>

    <!-- Konfigurasi Akun -->
    <a href="#" onclick="toggleSubmenu(this, 'konfigurasiAkun'); return false;" class="dropdown-toggle"><i class="fa-solid fa-user-gear me-2"></i> Konfigurasi Akun</a>
    <div class="collapse {{ if or (eq .ActivePage "login_history") (eq .ActivePage "pengaturan") }}show{{ end }}" id="konfigurasiAkun" {{ if or (eq .ActivePage "login_history") (eq .ActivePage "pengaturan") }}style="display: block;"{{ end }}>
        <a href="/admin/riwayat-login" class="ms-3 {{ if eq .ActivePage "login_history" }}active{{ end }}"><i class="fa-solid fa-clock-rotate-left me-2"></i> Riwayat Login</a>
        <a href="/admin/pengaturan" class="ms-3 {{ if eq .ActivePage "pengaturan" }}active{{ end }}"><i class="fa-solid fa-gear me-2"></i> Manajemen Akun</a>
    </div>

    <a href="#" onclick="handleLogout(event)"><i class="fa-solid fa-right-from-bracket me-2"></i> Keluar</a>
</div>

<script>
    function handleLogout(event) {
        event.preventDefault();
        fetch('/logout', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect;
            }
        });
    }

    // Fungsi untuk toggle sidebar responsive
    function toggleSidebar() {
        var sidebar = document.getElementById('sidebar');
        if (sidebar) {
            sidebar.classList.toggle('show');
        }
    }

    // Inisialisasi - pastikan submenu yang tidak aktif tertutup, yang aktif tetap terbuka
    document.addEventListener('DOMContentLoaded', function() {
        const navbarLogo = document.getElementById('navbarLogo');
        
        // Fallback logo dari localStorage jika logo backend gagal dimuat
        function fallbackLogo() {
            const savedLogo = localStorage.getItem('currentLogo');
            const backendLogo = '{{.LogoPath}}';
            
            // Jika logo dari backend berbeda dengan localStorage, gunakan backend
            if (backendLogo && backendLogo !== savedLogo) {
                navbarLogo.src = backendLogo;
                localStorage.setItem('currentLogo', backendLogo);
            } else if (savedLogo && navbarLogo.src !== savedLogo) {
                // Coba gunakan logo dari localStorage
                navbarLogo.src = savedLogo;
            } else {
                // Fallback ke placeholder
                navbarLogo.src = '/static/images/placeholder.png';
                localStorage.removeItem('currentLogo');
            }
        }
        
        if (navbarLogo) {
            // Update localStorage dengan logo dari backend
            const backendLogo = '{{.LogoPath}}';
            if (backendLogo && backendLogo !== 'undefined' && backendLogo !== '') {
                localStorage.setItem('currentLogo', backendLogo);
            }
            
            // Cek jika src kosong, undefined, atau gambar gagal dimuat
            if (!navbarLogo.src || navbarLogo.src.endsWith('/') || navbarLogo.src.includes('undefined')) {
                fallbackLogo();
            }
            // Selalu pasang fallback jika gambar gagal dimuat
            navbarLogo.onerror = function() {
                console.warn('Logo failed to load:', navbarLogo.src);
                // Hapus localStorage jika logo gagal dimuat
                localStorage.removeItem('currentLogo');
                // Gunakan placeholder
                navbarLogo.src = '/static/images/placeholder.png';
                navbarLogo.onerror = null; // Prevent infinite loop
            };
        }

        // Listener untuk update logo otomatis saat diubah di tab lain
        window.addEventListener('storage', function(e) {
            if (e.key === 'currentLogo') {
                const navbarLogo = document.getElementById('navbarLogo');
                if (navbarLogo) {
                    navbarLogo.src = e.newValue;
                }
            }
        });

        // Auto-open sidebar hanya di desktop
        const sidebar = document.querySelector('.sidebar');
        const hamburger = document.querySelector('.hamburger');
        function setSidebarInitial() {
            if (window.innerWidth > 768) {
                sidebar.classList.add('show');
                hamburger.classList.add('active');
            } else {
                sidebar.classList.remove('show');
                hamburger.classList.remove('active');
            }
        }
        setSidebarInitial();
        window.addEventListener('resize', setSidebarInitial);
    });

    var elemenCollapse = document.querySelectorAll('.collapse');
    elemenCollapse.forEach(function(element) {
        if (!element.classList.contains('show')) {
            // Tutup submenu yang tidak aktif
            element.classList.remove('show');
            element.style.display = 'none';
            var linkToggle = element.previousElementSibling;
            if (linkToggle) {
                linkToggle.setAttribute('aria-expanded', 'false');
            }
        } else {
            // Biarkan submenu yang aktif terbuka
            var linkToggle = element.previousElementSibling;
            if (linkToggle) {
                linkToggle.setAttribute('aria-expanded', 'true');
            }
        }
    });

    // Mencegah submenu tertutup saat klik link di dalamnya
    var linkSubmenu = document.querySelectorAll('.collapse a');
    linkSubmenu.forEach(function(link) {
        link.addEventListener('click', function(event) {
            event.stopPropagation();
        });
    });

    // Pastikan submenu tetap terbuka berdasarkan URL saat ini dengan animasi
    var currentURL = window.location.pathname;
    if (currentURL.includes('/admin/halaman/') || currentURL.includes('/admin/halaman')) {
        var kontenWebsite = document.getElementById('kontenWebsite');
        if (kontenWebsite && !kontenWebsite.classList.contains('show')) {
            kontenWebsite.style.display = 'block';
            kontenWebsite.style.maxHeight = '0px';
            kontenWebsite.style.opacity = '0';
            kontenWebsite.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            setTimeout(function() {
                kontenWebsite.classList.add('show');
                kontenWebsite.style.maxHeight = kontenWebsite.scrollHeight + 'px';
                kontenWebsite.style.opacity = '1';
            }, 10);
            setTimeout(function() {
                kontenWebsite.style.maxHeight = '';
                kontenWebsite.style.transition = '';
            }, 300);
            var toggle = kontenWebsite.previousElementSibling;
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'true');
            }
        }
    }
    if (currentURL.includes('/admin/riwayat-login') || currentURL.includes('/admin/pengaturan')) {
        var konfigurasiAkun = document.getElementById('konfigurasiAkun');
        if (konfigurasiAkun && !konfigurasiAkun.classList.contains('show')) {
            konfigurasiAkun.style.display = 'block';
            konfigurasiAkun.style.maxHeight = '0px';
            konfigurasiAkun.style.opacity = '0';
            konfigurasiAkun.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            setTimeout(function() {
                konfigurasiAkun.classList.add('show');
                konfigurasiAkun.style.maxHeight = konfigurasiAkun.scrollHeight + 'px';
                konfigurasiAkun.style.opacity = '1';
            }, 10);
            setTimeout(function() {
                konfigurasiAkun.style.maxHeight = '';
                konfigurasiAkun.style.transition = '';
            }, 300);
            var toggle = konfigurasiAkun.previousElementSibling;
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'true');
            }
        }
    }
    if (currentURL.includes('/admin/riwayat') || currentURL.includes('/admin/laporan') || currentURL.includes('/admin/transaksi')) {
        var transaksiLaporan = document.getElementById('transaksiLaporan');
        if (transaksiLaporan && !transaksiLaporan.classList.contains('show')) {
            transaksiLaporan.style.display = 'block';
            transaksiLaporan.style.maxHeight = '0px';
            transaksiLaporan.style.opacity = '0';
            transaksiLaporan.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            setTimeout(function() {
                transaksiLaporan.classList.add('show');
                transaksiLaporan.style.maxHeight = transaksiLaporan.scrollHeight + 'px';
                transaksiLaporan.style.opacity = '1';
            }, 10);
            setTimeout(function() {
                transaksiLaporan.style.maxHeight = '';
                transaksiLaporan.style.transition = '';
            }, 300);
            var toggle = transaksiLaporan.previousElementSibling;
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'true');
            }
        }
    }

    // Fungsi toggle sidebar
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const hamburger = document.querySelector('.hamburger');

        if (sidebar && hamburger) {
            sidebar.classList.toggle('show');
            hamburger.classList.toggle('active');
        }
    }

    // Fungsi toggle submenu dengan animasi
    function toggleSubmenu(toggle, id) {
        var elemenTarget = document.getElementById(id);
        var elemenToggle = toggle;

        if (elemenTarget) {
            // Toggle submenu yang diklik - klik pertama buka, klik kedua tutup
            if (elemenTarget.classList.contains('show')) {
                // Jika submenu sudah terbuka, tutup dengan animasi
                elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
                elemenTarget.style.opacity = '1';
                setTimeout(function() {
                    elemenTarget.style.maxHeight = '0px';
                    elemenTarget.style.opacity = '0';
                }, 10);
                setTimeout(function() {
                    elemenTarget.classList.remove('show');
                    elemenTarget.style.display = 'none';
                    elemenTarget.style.maxHeight = '';
                    elemenTarget.style.opacity = '';
                    elemenTarget.style.transition = '';
                    elemenToggle.setAttribute('aria-expanded', 'false');
                }, 300);
            } else {
                // Jika submenu tertutup, buka dan tutup semua submenu lain
                var semuaCollapse = document.querySelectorAll('.collapse');
                semuaCollapse.forEach(function(collapse) {
                    if (collapse !== elemenTarget && collapse.classList.contains('show')) {
                        collapse.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                        collapse.style.maxHeight = collapse.scrollHeight + 'px';
                        collapse.style.opacity = '1';
                        setTimeout(function() {
                            collapse.style.maxHeight = '0px';
                            collapse.style.opacity = '0';
                        }, 10);
                        setTimeout(function() {
                            collapse.classList.remove('show');
                            collapse.style.display = 'none';
                            collapse.style.maxHeight = '';
                            collapse.style.opacity = '';
                            collapse.style.transition = '';
                            var toggleLain = collapse.previousElementSibling;
                            if (toggleLain) {
                                toggleLain.setAttribute('aria-expanded', 'false');
                            }
                        }, 300);
                    }
                });

                // Buka submenu yang diklik dengan animasi
                elemenTarget.style.display = 'block';
                elemenTarget.style.maxHeight = '0px';
                elemenTarget.style.opacity = '0';
                elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                setTimeout(function() {
                    elemenTarget.classList.add('show');
                    elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
                    elemenTarget.style.opacity = '1';
                    elemenToggle.setAttribute('aria-expanded', 'true');
                }, 10);
                setTimeout(function() {
                    elemenTarget.style.maxHeight = '';
                    elemenTarget.style.transition = '';
                }, 300);
            }
        }
    }
</script>
{{end}}
