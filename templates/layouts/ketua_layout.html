<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} - Koperasi Simpan Pinjam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: #004aad;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            overflow-y: auto;
            z-index: 1000;
        }

        /* Hamburger Menu */
        .hamburger {
            display: block;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: none;
            color: black;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: none;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .navbar .navbar-brand {
                margin-left: 50px; /* Adjust to make space for hamburger */
            }
        }

        /* Desktop Styles */
        @media (min-width: 769px) {
            .hamburger {
                left: 255px; /* Position next to sidebar */
            }
        }

        .hamburger:hover {
            background: none;
        }

        .hamburger i {
            font-size: 20px;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .hamburger {
                display: block;
            }

            .main-content, .navbar, footer {
                margin-left: 0;
            }

            /* Adjust main content padding on mobile */
            .main-content {
                padding: 20px 15px;
            }

            /* Make stat cards responsive */
            .stat-card {
                margin-bottom: 20px;
            }
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            display: block;
            font-size: 15px;
            transition: background 0.2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #0a58ca;
        }

        /* Navbar */
        .navbar {
            margin-left: 240px;
            background: #ffffff;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.05);
        }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            padding: 30px;
            transition: margin-left 0.3s ease;
        }

        /* Statistik Cards */
        .stat-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            height: 100%;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .stat-icon {
            font-size: 2.3rem;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        footer {
            margin-left: 240px;
            padding: 15px;
            text-align: center;
            color: #666;
            background: #fff;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
{{ template "ketua_navbar.html" . }}

<!-- Main Content -->
<div class="main-content">
    {{ template "content" . }}
</div>

{{ template "ketua_footer" . }}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showSection(section) {
        alert('Tampilkan bagian: ' + section);
    }

    function logout() {
        if (confirm('Yakin ingin keluar?')) {
            window.location.href = '/logout';
        }
    }

    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const footer = document.querySelector('footer');
        sidebar.classList.toggle('show');
        if (window.innerWidth <= 768) {
            if (sidebar.classList.contains('show')) {
                footer.style.marginLeft = '240px';
            } else {
                footer.style.marginLeft = '0';
            }
        }
    }

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', function(event) {
        const sidebar = document.querySelector('.sidebar');
        const hamburger = document.querySelector('.hamburger');
        if (window.innerWidth <= 768 && !sidebar.contains(event.target) && !hamburger.contains(event.target)) {
            sidebar.classList.remove('show');
        }
    });
</script>
</body>
</html>
