{{define "ketua_navbar.html"}}
<!-- Hamburger Menu -->
<button class="hamburger" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
</button>

<!-- Sidebar -->
<div class="sidebar">
    <div class="text-center mb-3">
        <img src="/static/images/placeholder.png" alt="Logo Koperasi" class="img-fluid" style="max-width: 80px;">
        <h5 class="mt-2">Koperasi Simpan Pinjam</h5>
    </div>
    <a href="/ketua/ketua-dashboard" class="{{ if eq .ActivePage "dashboard" }}active{{ end }}"><i class="fa-solid fa-gauge me-2"></i> Dasbor</a>
    <a href="/ketua/ketua-data-anggota" class="{{ if eq .ActivePage "anggota" }}active{{ end }}"><i class="fa-solid fa-users me-2"></i> Data Anggota</a>
    <a href="/ketua/ketua-riwayat-login" class="{{ if eq .ActivePage "riwayat" }}active{{ end }}"><i class="fa-solid fa-clock-rotate-left me-2"></i> Riwayat Login</a>
    <a href="/ketua/ketua-laporan" class="{{ if eq .ActivePage "laporan" }}active{{ end }}"><i class="fa-solid fa-file-alt me-2"></i> Laporan</a>
    <a href="/ketua/ketua-pengaturan" class="{{ if eq .ActivePage "pengaturan" }}active{{ end }}"><i class="fa-solid fa-gear me-2"></i> Pengaturan</a>
    <a href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i> Keluar</a>
</div>

<script>
    // Initialize Bootstrap collapse
    document.addEventListener('DOMContentLoaded', function() {
        var collapseElements = document.querySelectorAll('.collapse');
        collapseElements.forEach(function(element) {
            new bootstrap.Collapse(element, {
                hide: true
            });
        });
    });
</script>
{{end}}
