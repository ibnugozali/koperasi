{{define "ketua_navbar.html"}}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <button class="hamburger me-3" onclick="toggleSidebar()" style="padding:6px 12px;background:#004aad;color:#fff;">
            <i class="fas fa-bars"></i>
        </button>
        <span class="navbar-brand fw-bold">Dasbor Ketua</span>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="text-center mb-3">
        <img id="navbarLogo" src="{{if .CurrentLogo}}{{.CurrentLogo}}{{else}}/static/images/placeholder.png{{end}}" alt="Logo Koperasi" class="img-fluid" style="max-width: 80px; background-color: transparent;" onerror="this.src='/static/images/placeholder.png'">
           <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
        <h5 class="mt-2">KOPMA</h5>
    </div>
    <a href="/ketua/ketua-dashboard" class="{{ if eq .ActivePage "dashboard" }}active{{ end }}"><i class="fa-solid fa-gauge me-2"></i> Dasbor</a>
    
    <!-- Manajemen Anggota -->
    <a href="#" onclick="toggleSubmenu(this, 'manajemenAnggota'); return false;" class="dropdown-toggle"><i class="fa-solid fa-users me-2"></i> Manajemen Anggota</a>
    <div class="collapse {{ if or (eq .ActivePage "konfirmasi_anggota") (eq .ActivePage "anggota") }}show{{ end }}" id="manajemenAnggota" {{ if or (eq .ActivePage "konfirmasi_anggota") (eq .ActivePage "anggota") (eq .ActivePage "setting_simpanan_wajib") }}style="display: block;"{{ end }}>
        <a href="/ketua/konfirmasi" class="ms-3 {{ if eq .ActivePage "konfirmasi_anggota" }}active{{ end }}"><i class="fa-solid fa-user-check me-2"></i> Konfirmasi Anggota</a>
        <a href="/ketua/anggota" class="ms-3 {{ if eq .ActivePage "anggota" }}active{{ end }}"><i class="fa-solid fa-users me-2"></i> Data Anggota</a>
    </div>

    <!-- Transaksi & Laporan -->
    <a href="#" onclick="toggleSubmenu(this, 'transaksiLaporan'); return false;" class="dropdown-toggle"><i class="fa-solid fa-chart-bar me-2"></i> Transaksi & Laporan</a>
    <div class="collapse {{ if or (eq .ActivePage "riwayat") (eq .ActivePage "laporan") (eq .ActivePage "konfirmasi-transaksi") (eq .ActivePage "transaksi-anggota") (eq .ActivePage "transaksi-pinjaman") (eq .ActivePage "transaksi-simpanan") (eq .ActivePage "transaksi-angsuran") (eq .ActivePage "upload-bukti-transfer-gaji") }}show{{ end }}" 
    id="transaksiLaporan" {{ if or (eq .ActivePage "riwayat") (eq .ActivePage "laporan") (eq .ActivePage "konfirmasi-transaksi") (eq .ActivePage "transaksi-anggota") (eq .ActivePage "transaksi-pinjaman") (eq .ActivePage "transaksi-simpanan") (eq .ActivePage "transaksi-angsuran") (eq .ActivePage "upload-bukti-transfer-gaji") }}style="display: block;"{{ end }}>
        <a href="/ketua/upload-bukti-transfer-gaji" class="ms-3 {{ if eq .ActivePage "upload-bukti-transfer-gaji" }}active{{ end }}"><i class="fa-solid fa-history me-2"></i> Bukti Transfer Gaji Anggota</a>
        <a href="/ketua/konfirmasi-transaksi" class="ms-3 {{ if eq .ActivePage "konfirmasi-transaksi" }}active{{ end }}"><i class="fa-solid fa-check-circle me-2"></i> Konfirmasi Transaksi</a>
        <a href="/ketua/riwayat" class="ms-3 {{ if eq .ActivePage "riwayat" }}active{{ end }}"><i class="fa-solid fa-history me-2"></i> Riwayat Transaksi</a>
        <a href="/ketua/laporan" class="ms-3 {{ if eq .ActivePage "laporan" }}active{{ end }}"><i class="fa-solid fa-file-alt me-2"></i> Laporan</a>
    </div>

    <a href="/ketua/ketua-pengaturan" class="{{ if eq .ActivePage "pengaturan" }}active{{ end }}"><i class="fa-solid fa-gear me-2"></i> Pengaturan</a>
    <a href="#" onclick="handleLogout(event)"><i class="fa-solid fa-right-from-bracket me-2"></i> Keluar</a>
</div>

<script>
function handleLogout(event) {
    event.preventDefault();
    fetch('/logout', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'}
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = data.redirect;
        }
    });
}

// Inisialisasi - pastikan submenu yang tidak aktif tertutup, yang aktif tetap terbuka
document.addEventListener('DOMContentLoaded', function() {
    const navbarLogo = document.getElementById('navbarLogo');
    
    // Update localStorage dengan logo dari backend
    if (navbarLogo) {
        const backendLogo = '{{.CurrentLogo}}';
        if (backendLogo && backendLogo !== 'undefined' && backendLogo !== '') {
            localStorage.setItem('currentLogo', backendLogo);
        }
        
        // Pasang error handler untuk logo
        navbarLogo.onerror = function() {
            console.warn('Logo failed to load:', navbarLogo.src);
            localStorage.removeItem('currentLogo');
            navbarLogo.src = '/static/images/placeholder.png';
            navbarLogo.onerror = null; // Prevent infinite loop
        };
    }
    
    // Listener untuk update logo otomatis saat diubah di tab lain
    window.addEventListener('storage', function(e) {
        if (e.key === 'currentLogo' && e.newValue) {
            const navbarLogo = document.getElementById('navbarLogo');
            if (navbarLogo) {
                navbarLogo.src = e.newValue;
            }
        }
    });

    const sidebar = document.getElementById('sidebar');
    const hamburger = document.querySelector('.hamburger');

    function setSidebarInitial() {
        if (window.innerWidth > 768) {
            sidebar.classList.add('show');
            hamburger.classList.add('active');
        } else {
            sidebar.classList.remove('show');
            hamburger.classList.remove('active');
        }
    }
    setSidebarInitial();
    window.addEventListener('resize', setSidebarInitial);
});

// Inisialisasi submenu yang tidak aktif
var elemenCollapse = document.querySelectorAll('.collapse');
elemenCollapse.forEach(function(element) {
    if (!element.classList.contains('show')) {
        // Tutup submenu yang tidak aktif
        element.classList.remove('show');
        element.style.display = 'none';
        var linkToggle = element.previousElementSibling;
        if (linkToggle) {
            linkToggle.setAttribute('aria-expanded', 'false');
        }
    } else {
        // Biarkan submenu yang aktif terbuka
        var linkToggle = element.previousElementSibling;
        if (linkToggle) {
            linkToggle.setAttribute('aria-expanded', 'true');
        }
    }
});

// Tutup sidebar hanya saat klik link submenu (bukan menu utama yang punya submenu) di mode mobile
function closeSidebarOnMobile() {
    var sidebar = document.querySelector('.sidebar');
    var hamburger = document.querySelector('.hamburger');
    if (window.innerWidth <= 768 && sidebar && hamburger) {
        sidebar.classList.remove('show');
        hamburger.classList.remove('active');
    }
}

// Untuk semua link di sidebar
var sidebarLinks = document.querySelectorAll('.sidebar a');
sidebarLinks.forEach(function(link) {
    link.addEventListener('click', function(event) {
        // Jika link ada di dalam .collapse (submenu) dan bukan menu utama
        if (link.closest('.collapse') && !link.classList.contains('dropdown-toggle')) {
            event.stopPropagation();
            closeSidebarOnMobile();
        }
    });
});

// Pastikan submenu tetap terbuka berdasarkan URL saat ini dengan animasi
var currentURL = window.location.pathname;

// Manajemen Anggota
if (currentURL === '/ketua/konfirmasi' || currentURL.includes('/ketua/anggota') || currentURL.includes('/ketua/login-history')) {
    var manajemenAnggota = document.getElementById('manajemenAnggota');
    if (manajemenAnggota && !manajemenAnggota.classList.contains('show')) {
        manajemenAnggota.style.display = 'block';
        manajemenAnggota.style.maxHeight = '0px';
        manajemenAnggota.style.opacity = '0';
        manajemenAnggota.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
        setTimeout(function() {
            manajemenAnggota.classList.add('show');
            manajemenAnggota.style.maxHeight = manajemenAnggota.scrollHeight + 'px';
            manajemenAnggota.style.opacity = '1';
        }, 10);
        setTimeout(function() {
            manajemenAnggota.style.maxHeight = '';
            manajemenAnggota.style.transition = '';
        }, 300);
        var toggle = manajemenAnggota.previousElementSibling;
        if (toggle) {
            toggle.setAttribute('aria-expanded', 'true');
        }
    }
}

// Transaksi & Laporan
if (currentURL.includes('/ketua/konfirmasi-transaksi') || currentURL.includes('/ketua/riwayat') || currentURL.includes('/ketua/laporan') || currentURL.includes('/ketua/transaksi-anggota') || currentURL.includes('/ketua/transaksi-pinjaman') || currentURL.includes('/ketua/transaksi-simpanan') || currentURL.includes('/ketua/transaksi-angsuran')) {
    var transaksiLaporan = document.getElementById('transaksiLaporan');
    if (transaksiLaporan && !transaksiLaporan.classList.contains('show')) {
        transaksiLaporan.style.display = 'block';
        transaksiLaporan.style.maxHeight = '0px';
        transaksiLaporan.style.opacity = '0';
        transaksiLaporan.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
        setTimeout(function() {
            transaksiLaporan.classList.add('show');
            transaksiLaporan.style.maxHeight = transaksiLaporan.scrollHeight + 'px';
            transaksiLaporan.style.opacity = '1';
        }, 10);
        setTimeout(function() {
            transaksiLaporan.style.maxHeight = '';
            transaksiLaporan.style.transition = '';
        }, 300);
        var toggle = transaksiLaporan.previousElementSibling;
        if (toggle) {
            toggle.setAttribute('aria-expanded', 'true');
        }
    }
}

// Fungsi toggle sidebar
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.querySelector('.hamburger');
    if (sidebar && hamburger) {
        sidebar.classList.toggle('show');
        hamburger.classList.toggle('active');
    }
}

// Fungsi toggle submenu dengan animasi
function toggleSubmenu(toggle, id) {
    var elemenTarget = document.getElementById(id);
    var elemenToggle = toggle;

    if (elemenTarget) {
        // Toggle submenu yang diklik - klik pertama buka, klik kedua tutup
        if (elemenTarget.classList.contains('show')) {
            // Jika submenu sudah terbuka, tutup dengan animasi
            elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
            elemenTarget.style.opacity = '1';
            setTimeout(function() {
                elemenTarget.style.maxHeight = '0px';
                elemenTarget.style.opacity = '0';
            }, 10);
            setTimeout(function() {
                elemenTarget.classList.remove('show');
                elemenTarget.style.display = 'none';
                elemenTarget.style.maxHeight = '';
                elemenTarget.style.opacity = '';
                elemenTarget.style.transition = '';
                elemenToggle.setAttribute('aria-expanded', 'false');
            }, 300);
        } else {
            // Jika submenu tertutup, buka dan tutup semua submenu lain
            var semuaCollapse = document.querySelectorAll('.collapse');
            semuaCollapse.forEach(function(collapse) {
                if (collapse !== elemenTarget && collapse.classList.contains('show')) {
                    collapse.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                    collapse.style.maxHeight = collapse.scrollHeight + 'px';
                    collapse.style.opacity = '1';
                    setTimeout(function() {
                        collapse.style.maxHeight = '0px';
                        collapse.style.opacity = '0';
                    }, 10);
                    setTimeout(function() {
                        collapse.classList.remove('show');
                        collapse.style.display = 'none';
                        collapse.style.maxHeight = '';
                        collapse.style.opacity = '';
                        collapse.style.transition = '';
                        var toggleLain = collapse.previousElementSibling;
                        if (toggleLain) {
                            toggleLain.setAttribute('aria-expanded', 'false');
                        }
                    }, 300);
                }
            });

            // Buka submenu yang diklik dengan animasi
            elemenTarget.style.display = 'block';
            elemenTarget.style.maxHeight = '0px';
            elemenTarget.style.opacity = '0';
            elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            setTimeout(function() {
                elemenTarget.classList.add('show');
                elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
                elemenTarget.style.opacity = '1';
                elemenToggle.setAttribute('aria-expanded', 'true');
            }, 10);
            setTimeout(function() {
                elemenTarget.style.maxHeight = '';
                elemenTarget.style.transition = '';
            }, 300);
        }
    }
}
</script>
{{end}}
