
{{define "ketua_navbar.html"}}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <button class="hamburger me-3" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <span class="navbar-brand fw-bold ms-auto">Dasbor Ketua</span>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="text-center mb-3">
        <img id="navbarLogo" src="{{if .CurrentLogo}}{{.CurrentLogo}}{{else}}/static/images/placeholder.png{{end}}" alt="Logo Koperasi" class="img-fluid" style="max-width: 80px; background-color: transparent;" onerror="this.src='/static/images/placeholder.png'">
        <h5 class="mt-2">KOPMA</h5>
    </div>
    <a href="/ketua/ketua-dashboard" class="{{ if eq .ActivePage "dashboard" }}active{{ end }}"><i class="fa-solid fa-gauge me-2"></i> Dasbor</a>
    <a href="/ketua/ketua-data-anggota" class="{{ if eq .ActivePage "anggota" }}active{{ end }}"><i class="fa-solid fa-users me-2"></i> Data Anggota</a>
    <a href="/ketua/ketua-riwayat-login" class="{{ if eq .ActivePage "riwayat" }}active{{ end }}"><i class="fa-solid fa-clock-rotate-left me-2"></i> Riwayat Login</a>
    <a href="/ketua/ketua-laporan" class="{{ if eq .ActivePage "laporan" }}active{{ end }}"><i class="fa-solid fa-file-alt me-2"></i> Laporan</a>
    <a href="/ketua/ketua-pengaturan" class="{{ if eq .ActivePage "pengaturan" }}active{{ end }}"><i class="fa-solid fa-gear me-2"></i> Pengaturan</a>
    <a href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i> Keluar</a>
</div>

<script>
    // Fungsi toggle sidebar
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.querySelector('.hamburger');
        if (sidebar && hamburger) {
            sidebar.classList.toggle('show');
            hamburger.classList.toggle('active');
        }
    }
    // Auto-open sidebar on page load
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.querySelector('.hamburger');
        if (sidebar && hamburger) {
            sidebar.classList.add('show');
            hamburger.classList.add('active');
        }
    });
</script>
{{end}}
