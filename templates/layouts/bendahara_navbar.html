{{define "bendahara_navbar.html"}}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
        <button class="hamburger me-3" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <span class="navbar-brand fw-bold">Dasbor Bendahara</span>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="text-center mb-3">
        <img id="navbarLogo" src="{{if .CurrentLogo}}{{.CurrentLogo}}{{else}}/static/images/placeholder.png{{end}}" alt="Logo Koperasi" class="img-fluid" style="max-width: 80px; background-color: transparent;" onerror="this.src='/static/images/placeholder.png'">
           <link rel="icon" type="image/png" href="{{.CurrentLogo}}" />
        <h5 class="mt-2">KOPMA</h5>
    </div>
    <a href="/bendahara/dashboard" class="{{ if eq .ActivePage "dashboard" }}active{{ end }}"><i class="fa-solid fa-gauge me-2"></i> Dasbor</a>

    <!-- Konfirmasi Transaksi (Simpanan & Angsuran) -->
    <a href="/bendahara/konfirmasi-transaksi" class="{{ if eq .ActivePage "konfirmasi-transaksi" }}active{{ end }}"><i class="fa-solid fa-check-circle me-2"></i> Konfirmasi Transaksi</a>
    
    <a href="/bendahara/anggota" class="{{ if eq .ActivePage "anggota" }}active{{ end }}"><i class="fa-solid fa-users me-2"></i> Data Anggota</a>

    <!-- Konten Website -->
    <a href="#" onclick="toggleSubmenu(this, 'kontenWebsite'); return false;" class="dropdown-toggle"><i class="fa-solid fa-globe me-2"></i> Konfigurasi Simpanan</a>
    <div class="collapse {{ if or (eq .ActivePage "setting_simpanan_wajib") (eq .ActivePage "edit-rekening-register") (eq .ActivePage "edit-bunga") }}show{{ end }}" id="kontenWebsite" {{ if or (eq .ActivePage "setting_simpanan_wajib") (eq .ActivePage "edit-rekening-register") (eq .ActivePage "edit-bunga") }}style="display: block;"{{ end }}>
        <a href="/bendahara/setting-simpanan-wajib" class="ms-3 {{ if eq .ActivePage "setting_simpanan_wajib" }}active{{ end }}"><i class="fa-solid fa-cog me-2"></i> Simpanan Wajib</a>
        <a href="/bendahara/edit-rekening-register" class="ms-3 {{ if eq .ActivePage "edit-rekening-register" }}active{{ end }}"><i class="fa-solid fa-edit me-2"></i> Nomor Rekening</a>
        <a href="/bendahara/edit-bunga" class="ms-3 {{ if eq .ActivePage "edit-bunga" }}active{{ end }}"><i class="fa-solid fa-percent me-2"></i> Bunga</a>
    </div>

    <a href="/bendahara/riwayat" class="{{ if eq .ActivePage "riwayat" }}active{{ end }}"><i class="fa-solid fa-history me-2"></i> Riwayat Transaksi</a>

    <a href="/bendahara/pesan" class="{{ if eq .ActivePage "pesan" }}active{{ end }}"><i class="fa-solid fa-envelope me-2"></i> Pesan</a>
    <a href="/bendahara/pengaturan" class="{{ if eq .ActivePage "pengaturan" }}active{{ end }}"><i class="fa-solid fa-gear me-2"></i> Pengaturan</a>
    <a href="#" onclick="handleLogout(event)"><i class="fa-solid fa-right-from-bracket me-2"></i> Keluar</a>
</div>

<script>
    function handleLogout(event) {
        event.preventDefault();
        fetch('/logout', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect;
            }
        });
    }

    // Inisialisasi - pastikan submenu yang tidak aktif tertutup, yang aktif tetap terbuka
    document.addEventListener('DOMContentLoaded', function() {
        // Listener untuk update logo otomatis saat diubah di tab lain
        window.addEventListener('storage', function(e) {
            if (e.key === 'currentLogo' && e.newValue) {
                const navbarLogo = document.getElementById('navbarLogo');
                if (navbarLogo && e.newValue !== '/static/images/placeholder.png') {
                    navbarLogo.src = e.newValue;
                }
            }
        });

        // Auto-open sidebar hanya di desktop
        const sidebar = document.querySelector('.sidebar');
        const hamburger = document.querySelector('.hamburger');
        function setSidebarInitial() {
            if (window.innerWidth > 768) {
                sidebar.classList.add('show');
                hamburger.classList.add('active');
            } else {
                sidebar.classList.remove('show');
                hamburger.classList.remove('active');
            }
        }
        setSidebarInitial();
        window.addEventListener('resize', setSidebarInitial);
    });

    var elemenCollapse = document.querySelectorAll('.collapse');
    elemenCollapse.forEach(function(element) {
        if (!element.classList.contains('show')) {
            // Tutup submenu yang tidak aktif
            element.classList.remove('show');
            element.style.display = 'none';
            var linkToggle = element.previousElementSibling;
            if (linkToggle) {
                linkToggle.setAttribute('aria-expanded', 'false');
            }
        } else {
            // Biarkan submenu yang aktif terbuka
            var linkToggle = element.previousElementSibling;
            if (linkToggle) {
                linkToggle.setAttribute('aria-expanded', 'true');
            }
        }
    });


    // Tutup sidebar hanya saat klik link submenu (bukan menu utama yang punya submenu) di mode mobile
    function closeSidebarOnMobile() {
        var sidebar = document.querySelector('.sidebar');
        var hamburger = document.querySelector('.hamburger');
        if (window.innerWidth <= 768 && sidebar && hamburger) {
            sidebar.classList.remove('show');
            hamburger.classList.remove('active');
        }
    }

    // Untuk semua link di sidebar
    var sidebarLinks = document.querySelectorAll('.sidebar a');
    sidebarLinks.forEach(function(link) {
        link.addEventListener('click', function(event) {
            // Jika link ada di dalam .collapse (submenu) dan bukan menu utama
            if (link.closest('.collapse') && !link.classList.contains('dropdown-toggle')) {
                event.stopPropagation();
                closeSidebarOnMobile();
            }
        });
    });

    // Pastikan submenu tetap terbuka berdasarkan URL saat ini dengan animasi
    var currentURL = window.location.pathname;
    if (currentURL.includes('/bendahara/halaman/edit')) {
        var kontenWebsite = document.getElementById('kontenWebsite');
        if (kontenWebsite && !kontenWebsite.classList.contains('show')) {
            kontenWebsite.style.display = 'block';
            kontenWebsite.style.maxHeight = '0px';
            kontenWebsite.style.opacity = '0';
            kontenWebsite.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
            setTimeout(function() {
                kontenWebsite.classList.add('show');
                kontenWebsite.style.maxHeight = kontenWebsite.scrollHeight + 'px';
                kontenWebsite.style.opacity = '1';
            }, 10);
            setTimeout(function() {
                kontenWebsite.style.maxHeight = '';
                kontenWebsite.style.transition = '';
            }, 300);
            var toggle = kontenWebsite.previousElementSibling;
            if (toggle) {
                toggle.setAttribute('aria-expanded', 'true');
            }
        }
    }

    // Fungsi toggle sidebar
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const hamburger = document.querySelector('.hamburger');

        if (sidebar && hamburger) {
            sidebar.classList.toggle('show');
            hamburger.classList.toggle('active');
        }
    }

    // Fungsi toggle submenu dengan animasi
    function toggleSubmenu(toggle, id) {
        var elemenTarget = document.getElementById(id);
        var elemenToggle = toggle;

        if (elemenTarget) {
            // Toggle submenu yang diklik - klik pertama buka, klik kedua tutup
            if (elemenTarget.classList.contains('show')) {
                // Jika submenu sudah terbuka, tutup dengan animasi
                elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
                elemenTarget.style.opacity = '1';
                setTimeout(function() {
                    elemenTarget.style.maxHeight = '0px';
                    elemenTarget.style.opacity = '0';
                }, 10);
                setTimeout(function() {
                    elemenTarget.classList.remove('show');
                    elemenTarget.style.display = 'none';
                    elemenTarget.style.maxHeight = '';
                    elemenTarget.style.opacity = '';
                    elemenTarget.style.transition = '';
                    elemenToggle.setAttribute('aria-expanded', 'false');
                }, 300);
            } else {
                // Jika submenu tertutup, buka dan tutup semua submenu lain
                var semuaCollapse = document.querySelectorAll('.collapse');
                semuaCollapse.forEach(function(collapse) {
                    if (collapse !== elemenTarget && collapse.classList.contains('show')) {
                        collapse.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                        collapse.style.maxHeight = collapse.scrollHeight + 'px';
                        collapse.style.opacity = '1';
                        setTimeout(function() {
                            collapse.style.maxHeight = '0px';
                            collapse.style.opacity = '0';
                        }, 10);
                        setTimeout(function() {
                            collapse.classList.remove('show');
                            collapse.style.display = 'none';
                            collapse.style.maxHeight = '';
                            collapse.style.opacity = '';
                            collapse.style.transition = '';
                            var toggleLain = collapse.previousElementSibling;
                            if (toggleLain) {
                                toggleLain.setAttribute('aria-expanded', 'false');
                            }
                        }, 300);
                    }
                });

                // Buka submenu yang diklik dengan animasi
                elemenTarget.style.display = 'block';
                elemenTarget.style.maxHeight = '0px';
                elemenTarget.style.opacity = '0';
                elemenTarget.style.transition = 'max-height 0.3s ease-in-out, opacity 0.3s ease-in-out';
                setTimeout(function() {
                    elemenTarget.classList.add('show');
                    elemenTarget.style.maxHeight = elemenTarget.scrollHeight + 'px';
                    elemenTarget.style.opacity = '1';
                    elemenToggle.setAttribute('aria-expanded', 'true');
                }, 10);
                setTimeout(function() {
                    elemenTarget.style.maxHeight = '';
                    elemenTarget.style.transition = '';
                }, 300);
            }
        }
    }
</script>
{{end}}
