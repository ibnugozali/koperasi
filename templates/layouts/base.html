<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KOPMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    .dropdown-submenu {
      position: relative;
    }
    .dropdown-submenu > .dropdown-menu {
      top: 0;
      left: 100%;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  {{ template "navbar.html" . }}

  <main class="container py-4 flex-grow-1">
    {{ block "content" . }}{{ end }}
  </main>
  
  {{ template "footer.html" . }}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", function(){
    // Menangani klik pada item yang memiliki submenu
    document.querySelectorAll('.dropdown-submenu > a.dropdown-toggle').forEach(function(element){
      element.addEventListener('click', function (e) {
        // Mencegah link berpindah halaman dan menghentikan event lain
        e.preventDefault();
        e.stopPropagation();

        let submenu = this.nextElementSibling;
        if (submenu) {
          // Menutup submenu lain yang mungkin terbuka di level yang sama
          this.closest('.dropdown-menu').querySelectorAll('.dropdown-menu.show').forEach(function(menu){
            if(menu !== submenu) {
              menu.classList.remove('show');
            }
          });
          // Membuka atau menutup submenu yang diklik
          submenu.classList.toggle('show');
        }
      });
    });
  });
  </script>
</body>
</html>
